<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tributary — all published traces</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         margin: 0; background: #f7f6f3; color: #222; line-height: 1.55; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 2.5rem 1.2rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0 0 0.3rem; }
  .sub { color: #666; font-size: 0.92rem; margin: 0 0 2rem; }
  .sub a { color: #2a6fa3; text-decoration: none; }
  .card { display: block; background: #fff; border: 1px solid #e5e5e5; border-radius: 8px;
          padding: 1rem 1.2rem; margin-bottom: 0.8rem; text-decoration: none; color: inherit;
          transition: border-color 0.15s, box-shadow 0.15s; }
  .card:hover { border-color: #888; box-shadow: 0 1px 8px rgba(0,0,0,0.08); }
  .card .kind { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.05em;
                padding: 0.12rem 0.5rem; border-radius: 3px; color: #fff; margin-right: 0.5rem;
                background: #5a4b8a; }
  .card .title { font-weight: 600; font-size: 1.02rem; }
  .card p { margin: 0.45rem 0 0; color: #555; font-size: 0.9rem; }
  .empty { color: #888; }
</style>
</head>
<body>
<div class="wrap">
  <h1>All published traces</h1>
  <p class="sub">The full archive, newest first — every event analysis in the public corpus.
     (A paste-a-claim search is planned; for now this is a browsable list.)
     <a href="index.html">← back to Tributary</a></p>
  <div id="corpus-list"><p class="empty">Loading the corpus…</p></div>
</div>
<script>
// Corpus list: rendered from gallery/index.json (written by publish.py).
fetch('gallery/index.json')
  .then(r => { if (!r.ok) throw new Error(); return r.json(); })
  .then(idx => {
    const entries = idx.entries || [];
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
      c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    document.getElementById('corpus-list').innerHTML = entries.length ? entries.map(e => `
      <a class="card" href="fingerprint_viewer.html?load=gallery/events/${esc(e.id)}.json">
        <span class="kind">event analysis</span><span class="title">${esc(e.event)}</span>
        <p>${e.event_date ? esc(String(e.event_date).slice(0, 10)) + ' · ' : ''}${e.n_framings} framings${
          e.n_actors ? ' · ' + e.n_actors + ' actors' : ''}${e.skew ? ' · coverage: ' + esc(e.skew) : ''}</p>
      </a>`).join('') : '<p class="empty">No published events yet.</p>';
  })
  .catch(() => { document.getElementById('corpus-list').innerHTML =
    '<p class="empty">Could not load the corpus index.</p>'; });
</script>
</body>
</html>
