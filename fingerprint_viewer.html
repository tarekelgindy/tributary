function renderSocialSpread(lineage) {
  if (!lineage.social_search_performed) return '';
  const posts = lineage.social_spread || [];
  const notes = lineage.social_search_notes || '';

  // Compute simple aggregate stats for the header
  const totalEngagement = posts.reduce(
    (acc, p) => acc + (p.likes || 0) + (p.reposts || 0), 0
  );
  const uniqueAuthors = new Set(posts.map(p => p.author_handle)).size;
  const roleCounts = {};
  posts.forEach(p => {
    const r = p.amplifier_role || 'unknown';
    roleCounts[r] = (roleCounts[r] || 0) + 1;
  });

  // Sort posts: by engagement desc so most-impactful surface first
  const sortedPosts = [...posts].sort(
    (a, b) => ((b.likes || 0) + (b.reposts || 0)) - ((a.likes || 0) + (a.reposts || 0))
  );

  const postsHtml = sortedPosts.map(p => {
    const role = p.amplifier_role || 'unknown';
    const engagement = `${p.likes || 0} likes · ${p.reposts || 0} reposts${p.replies ? ` · ${p.replies} replies` : ''}`;
    return `
      <div class="social-post role-${role}">
        <div class="post-head">
          <span class="post-author">@${escapeHtml(p.author_handle || '?')}</span>
          <span class="post-date">${escapeHtml((p.post_date || '').slice(0, 10))}</span>
          <span class="post-engagement">${escapeHtml(engagement)}</span>
        </div>
        <div class="post-text">${escapeHtml(p.post_text || '')}</div>
        <div class="post-role">
          <span class="role-tag ${role}">${escapeHtml(role)}</span>
          ${p.role_evidence ? ` <span style="color:#666;">— ${escapeHtml(p.role_evidence)}</span>` : ''}
          ${provenanceBadge(p)}${verifyBadge(p)}${archiveBadge(p)}
          ${p.post_url ? `<a href="${escapeHtml(p.post_url)}" target="_blank" rel="noopener" style="float:right;">↗ open</a>` : ''}
        </div>
      </div>
    `;
  }).join('');

  const roleBreakdown = Object.entries(roleCounts)
    .sort((a, b) => b[1] - a[1])
    .map(([r, c]) => `${r}: ${c}`).join(' · ');

  return `
    <div class="card social-card">
      <h2>Social Spread (Bluesky)</h2>
      ${notes ? `<div class="social-note">${escapeHtml(notes)}</div>` : ''}
      ${posts.length === 0 ? `<p class="empty">No posts found.</p>` : `
        <div class="social-summary">
          <div><strong>${posts.length}</strong> posts</div>
          <div><strong>${uniqueAuthors}</strong> unique authors</div>
          <div><strong>${totalEngagement.toLocaleString()}</strong> total engagement</div>
          <div style="color:#777;">${escapeHtml(roleBreakdown)}</div>
        </div>
        <details class="collapse" style="margin-top:0.5rem;">
          <summary>Posts (sorted by engagement)</summary>
          <div class="body normal-text">
            ${postsHtml}
          </div>
        </details>
      `}
    </div>
  `;
}

function drawStatsChart(svgId, stats) {
  const svg = document.getElementById(svgId);
  if (!svg || !stats || !stats.instances_per_year_by_role) return;
  svg.innerHTML = '';

  const ns = 'http://www.w3.org/2000/svg';
  const width = svg.clientWidth || 800;
  const height = 110;
  const padding = 30;
  const chartHeight = height - 28;       // leave room for x-axis labels

  const yearKeys = Object.keys(stats.instances_per_year_by_role)
    .map(Number).filter(y => !Number.isNaN(y));
  if (yearKeys.length === 0) return;

  yearKeys.sort((a, b) => a - b);
  const minYear = yearKeys[0];
  const maxYear = yearKeys[yearKeys.length - 1];
  const range = Math.max(1, maxYear - minYear);
  const maxCount = Math.max(...Object.values(stats.instances_per_year || {}));

  // Bar width auto-scales — narrow bars for wide spans (e.g. 1377-2023),
  // chunkier bars for compact ones (e.g. 1992-2018).
  const barWidth = Math.max(2, (width - 2 * padding) / Math.max(range, 10));

  Object.entries(stats.instances_per_year_by_role).forEach(([yearStr, byRole]) => {
    const year = Number(yearStr);
    if (Number.isNaN(year)) return;
    const x = padding + ((year - minYear) / range) * (width - 2 * padding);
    let stackedHeight = 0;
    ROLE_ORDER.forEach(role => {
      const count = byRole[role] || 0;
      if (count === 0) return;
      const segHeight = (count / maxCount) * chartHeight;
      const rect = document.createElementNS(ns, 'rect');
      rect.setAttribute('x', x - barWidth / 2);
      rect.setAttribute('y', chartHeight - stackedHeight - segHeight);
      rect.setAttribute('width', barWidth);
      rect.setAttribute('height', segHeight);
      rect.setAttribute('fill', ROLE_COLORS[role] || ROLE_COLORS.unknown);
      const title = document.createElementNS(ns, 'title');
      title.textContent = `${year} · ${role}: ${count}`;
      rect.appendChild(title);
      svg.appendChild(rect);
      stackedHeight += segHeight;
    });
  });

  // Axis ticks
  const tickCount = 5;
  for (let i = 0; i <= tickCount; i++) {
    const x = padding + ((width - 2 * padding) * i / tickCount);
    const year = Math.round(minYear + (range * i / tickCount));
    const text = document.createElementNS(ns, 'text');
    text.setAttribute('x', x);
    text.setAttribute('y', chartHeight + 16);
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('class', 'tick');
    text.textContent = year;
    svg.appendChild(text);
  }
}

function renderMutationsBlock(label, mutations, instances) {
  if (!mutations || mutations.length === 0) return '';

  // Look up the from/to instances by URL so each card can show author + date
  const byUrl = {};
  (instances || []).forEach(i => { byUrl[i.source_url] = i; });

  const cards = mutations.map(m => {
    const from = byUrl[m.from_source] || {};
    const to = byUrl[m.to_source] || {};
    const fields = [];
    if (m.preserved) fields.push(['preserved', 'Preserved', m.preserved]);
    if (m.dropped) fields.push(['dropped', 'Dropped', m.dropped]);
    if (m.added) fields.push(['added', 'Added', m.added]);
    if (m.distorted) fields.push(['distorted', 'Distorted', m.distorted]);
    return `
      <div class="mutation-card">
        <div class="mutation-head">
          <div class="mutation-arrow">
            <span>${escapeHtml(from.date || '?')} · ${escapeHtml(truncate(from.author, 48))}</span>
            <span class="arrow">→</span>
            <span>${escapeHtml(to.date || '?')} · ${escapeHtml(truncate(to.author, 48))}</span>
          </div>
        </div>
        <div class="mutation-body">
          ${fields.map(([cls, lbl, text]) => `
            <div class="mutation-field ${cls}">
              <span class="mutation-label">${lbl}</span>
              <span class="mutation-text">${escapeHtml(text)}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');

  return `
    <details class="collapse">
      <summary>${label} mutations (${mutations.length})</summary>
      <div class="body normal-text">
        <p style="color:#777; font-size:0.82rem; margin: 0 0 1rem;">How the framing changed across significant transitions in this lineage.</p>
        ${cards}
      </div>
    </details>
  `;
}

function renderOverview(fp) {
  const panel = document.querySelector('[data-panel=overview]');
  const lex = fp.genealogy?.lexical || {};
  const con = fp.genealogy?.conceptual || {};
  const lexLog = lex.attestation_log || [];
  const conLog = con.attestation_log || [];
  const lexByRole = instancesByRole(lexLog);
  const conByRole = instancesByRole(conLog);

  const lexOrig = lexByRole.originator[0] || lexLog[0];
  const conOrig = conByRole.originator[0] || conLog[0];
  const massAmps = lexByRole['mass-amplifier'].concat(conByRole['mass-amplifier']).slice(0, 5);
  const institutional = lexByRole['institutional-adoption'].concat(conByRole['institutional-adoption']);
  const critics = lexByRole.critic.concat(conByRole.critic);

  panel.innerHTML = `
    <div class="summary-grid">
      <div class="card">
        <h2>Phrase Origin</h2>
        ${lexOrig ? `
          <div class="title-line">${escapeHtml(lexOrig.date || '?')} · ${escapeHtml(lexOrig.author || '')}</div>
          <p style="color:#666; font-size:0.9rem;">${escapeHtml(lexOrig.source_title || '')}</p>
          ${lexOrig.exact_quote ? `<p class="quote" style="background:#faf7ef; padding:0.5rem 0.7rem; border-radius:4px; font-style:italic; color:#444;">"${escapeHtml(lexOrig.exact_quote.slice(0, 280))}"</p>` : ''}
        ` : '<p class="empty">No lexical attestation found.</p>'}
      </div>
      <div class="card">
        <h2>Conceptual Origin</h2>
        ${conOrig ? `
          <div class="title-line">${escapeHtml(conOrig.date || '?')} · ${escapeHtml(conOrig.author || '')}</div>
          <p style="color:#666; font-size:0.9rem;">${escapeHtml(conOrig.source_title || '')}</p>
          ${conOrig.exact_quote ? `<p class="quote" style="background:#faf7ef; padding:0.5rem 0.7rem; border-radius:4px; font-style:italic; color:#444;">"${escapeHtml(conOrig.exact_quote.slice(0, 280))}"</p>` : ''}
        ` : '<p class="empty">No conceptual ancestor found.</p>'}
      </div>
    </div>

    ${massAmps.length ? `<div class="card">
      <h2>Mass Amplifiers</h2>
      ${massAmps.map(instanceLine).join('')}
    </div>` : ''}

    ${institutional.length ? `<div class="card">
      <h2>Institutional Adoption</h2>
      ${institutional.map(instanceLine).join('')}
    </div>` : ''}

    ${critics.length ? `<div class="card">
      <h2>Critics</h2>
      ${critics.map(instanceLine).join('')}
    </div>` : ''}

    <div class="card">
      <h2>Stats</h2>
      <div class="entity-grid">
        <div><div class="label">Lexical instances</div><div class="value">${lexLog.length}</div></div>
        <div><div class="label">Conceptual contributors</div><div class="value">${conLog.length}</div></div>
        <div><div class="label">Lexical status</div><div class="value">${escapeHtml(lex.status || 'unknown')}</div></div>
        <div><div class="label">Conceptual status</div><div class="value">${escapeHtml(con.status || 'unknown')}</div></div>
      </div>
    </div>
  `;
}

  const conLog = con.attestation_log || [];

    <div class="role-legend">
      ${ROLE_ORDER.map(role => `

    <div class="timeline-block">

        <h2>Lexical Lineage</h2>

      </div>
      <svg class="timeline-svg" id="timeline-lexical"></svg>

    ${renderTimelineStats('Lexical', lex.timeline_stats, 'stats-lexical')}
    ${renderSocialSpread(lex)}

    <div class="timeline-block">
      <div class="timeline-header">

      </div>

    <p style="color:#777; font-size:0.85rem; margin: 0 0 1rem;">Click any dot to see the full instance details.</p>
    <div id="instance-detail"></div>

    ${renderMutationsBlock('Lexical', lex.mutations, lexLog)}
    ${renderMutationsBlock('Conceptual', con.mutations, conLog)}

    <details class="collapse">

    </details>

    <details class="collapse">
      <summary>Conceptual adversarial notes</summary>
      <div class="body">${escapeHtml(con.adversarial_notes || '(no adversarial notes recorded)')}</div>
    </details>
  `;
}

function drawTimeline(svgId, instances) {
  const svg = document.getElementById(svgId);
  if (!svg) return;
  svg.innerHTML = '';
  const ns = 'http://www.w3.org/2000/svg';
  const width = svg.clientWidth || 800;
  const height = 90;
  const padding = 36;
  const axisY = height / 2;

  if (!instances.length) {
    const text = document.createElementNS(ns, 'text');
    text.setAttribute('x', '50%'); text.setAttribute('y', '50%');
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('fill', '#aaa');
    text.setAttribute('font-size', '12');
    text.textContent = 'No instances';
    svg.appendChild(text);
    return;
  }

  const datedInstances = instances
    .map(i => ({ ...i, year: parseYear(i.date) }))
    .filter(i => i.year != null);

  if (datedInstances.length === 0) {
    const text = document.createElementNS(ns, 'text');
    text.setAttribute('x', '50%'); text.setAttribute('y', '50%');
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('fill', '#aaa');
    text.setAttribute('font-size', '12');
    text.textContent = 'No dated instances';
    svg.appendChild(text);
    return;
  }

  const years = datedInstances.map(i => i.year);
  const minYear = Math.min(...years);
  const maxYear = Math.max(...years);
  const range = Math.max(1, maxYear - minYear);

  // Axis line
  const line = document.createElementNS(ns, 'line');
  line.setAttribute('x1', padding); line.setAttribute('x2', width - padding);
  line.setAttribute('y1', axisY); line.setAttribute('y2', axisY);
  line.setAttribute('class', 'lineage-line');
  svg.appendChild(line);

  // Year ticks
  const tickCount = 5;
  for (let i = 0; i <= tickCount; i++) {
    const x = padding + ((width - 2 * padding) * i / tickCount);
    const year = Math.round(minYear + (range * i / tickCount));
    const tick = document.createElementNS(ns, 'line');
    tick.setAttribute('x1', x); tick.setAttribute('x2', x);
    tick.setAttribute('y1', axisY - 4); tick.setAttribute('y2', axisY + 4);
    tick.setAttribute('stroke', '#bbb');
    svg.appendChild(tick);
    const text = document.createElementNS(ns, 'text');
    text.setAttribute('x', x); text.setAttribute('y', axisY + 24);
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('class', 'tick');
    text.textContent = year;
    svg.appendChild(text);
  }

  // Group dots by x position (within 8px) and stack vertically when overlapping
  const bucketed = {};
  datedInstances.forEach(inst => {
    const x = padding + ((inst.year - minYear) / range) * (width - 2 * padding);
    const key = Math.round(x / 8) * 8;
    (bucketed[key] = bucketed[key] || []).push({ inst, x });
  });

  Object.values(bucketed).forEach(bucket => {
    bucket.forEach(({ inst, x }, idx) => {
      const verticalOffset = (idx - (bucket.length - 1) / 2) * 12;
      const role = inst.amplifier_role || 'unknown';
      const color = ROLE_COLORS[role] || ROLE_COLORS.unknown;
      const circle = document.createElementNS(ns, 'circle');
      circle.setAttribute('cx', x);
      circle.setAttribute('cy', axisY - 18 + verticalOffset);
      circle.setAttribute('r', 5);
      circle.setAttribute('fill', color);
      circle.setAttribute('stroke', 'white');
      circle.setAttribute('stroke-width', 1.5);
      circle.setAttribute('class', 'instance');
      const tooltip = `${inst.date || '?'} · ${(inst.author || 'unknown')} · ${role}`;
      const title = document.createElementNS(ns, 'title');
      title.textContent = tooltip;
      circle.appendChild(title);
      circle.addEventListener('click', () => showDetail(inst));
      svg.appendChild(circle);
    });
  });
}

function parseYear(dateStr) {
  if (!dateStr) return null;
  const m = String(dateStr).match(/^(\d{4})/);
  return m ? parseInt(m[1], 10) : null;
}

function showDetail(inst) {
  const role = inst.amplifier_role || 'unknown';
  const detail = document.getElementById('instance-detail');
  detail.innerHTML = `
    <div class="detail-card role-${role}">
      <div class="head">
        <span class="date">${escapeHtml(inst.date || '?')}</span>
        <span class="role-tag ${role}">${escapeHtml(role)}</span>
      </div>
      <div class="title-line">${escapeHtml(inst.source_title || '')}</div>
      <div class="author">${escapeHtml(inst.author || '')}</div>
      ${inst.exact_quote ? `<div class="quote">"${escapeHtml(inst.exact_quote)}"</div>` : ''}
      ${inst.lexical_form_seen ? `<div class="field"><span class="label">Form seen</span>${escapeHtml(inst.lexical_form_seen)}</div>` : ''}
      ${inst.evidence ? `<div class="field"><span class="label">Evidence</span>${escapeHtml(inst.evidence)}</div>` : ''}
      ${inst.role_evidence ? `<div class="field"><span class="label">Role evidence</span>${escapeHtml(inst.role_evidence)}</div>` : ''}
      ${inst.confidence != null ? `<div class="field"><span class="label">Confidence</span>${inst.confidence}</div>` : ''}
      ${provenanceBadge(inst) ? `<div class="field"><span class="label">Provenance</span>${provenanceBadge(inst)}</div>` : ''}
      ${(verifyBadge(inst) || archiveBadge(inst)) ? `<div class="field"><span class="label">Verification</span>${verifyBadge(inst)}${archiveBadge(inst)}</div>` : ''}
      ${inst.source_url ? `<div class="field"><span class="label">Source</span><a href="${escapeHtml(inst.source_url)}" target="_blank" rel="noopener">${escapeHtml(inst.source_url)}</a></div>` : ''}
    </div>
  `;
  detail.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function renderEvidence(fp) {
  const panel = document.querySelector('[data-panel=evidence]');
  const ev = fp.evidence_landscape || {};
  const sources = ev.sources || [];

  if (sources.length === 0 && !ev.summary) {
    panel.innerHTML = `
      <div class="card">
        <p class="empty">Evidence landscape was not generated for this fingerprint (use --no-evidence to skip; or this is an older fingerprint that predates the feature).</p>
      </div>`;
    return;
  }

  const byDirection = { supports: [], disputes: [], redirects: [], 'shared-context': [] };
  sources.forEach(s => {
    const d = s.direction || 'shared-context';
    if (!byDirection[d]) byDirection[d] = [];
    byDirection[d].push(s);
  });

  // Sort each direction by source_type (primary first) then strength
  const strengthOrder = { strong: 0, moderate: 1, weak: 2, '': 3 };
  const typeOrder = { primary: 0, secondary: 1, tertiary: 2, '': 3 };
  Object.values(byDirection).forEach(arr => {
    arr.sort((a, b) =>
      (typeOrder[a.source_type] ?? 9) - (typeOrder[b.source_type] ?? 9) ||
      (strengthOrder[a.strength] ?? 9) - (strengthOrder[b.strength] ?? 9)
    );
  });

  const column = (dirKey, label) => {
    const items = byDirection[dirKey] || [];
    return `
      <div class="evidence-column ${dirKey}">
        <h2>${label} (${items.length})</h2>
        ${items.length === 0
          ? '<p class="empty">None identified.</p>'
          : items.map(renderEvidenceCard).join('')}
      </div>
    `;
  };

  panel.innerHTML = `
    ${ev.summary ? `<div class="evidence-summary">
      <h2>Summary</h2>
      ${escapeHtml(ev.summary)}
    </div>` : ''}

    <div class="evidence-grid">
      ${column('supports', 'Supports')}
      ${column('disputes', 'Disputes')}
      ${column('redirects', 'Redirects')}
      ${column('shared-context', 'Shared Context')}
    </div>

    ${ev.search_notes ? `<details class="collapse">
      <summary>Search notes</summary>
      <div class="body normal-text">${escapeHtml(ev.search_notes)}</div>
    </details>` : ''}
  `;
}

function renderEvidenceCard(s) {
  const dir = s.direction || 'shared-context';
  const showStrength = dir === 'supports' || dir === 'disputes';
  const statusBadge = s.status && s.status !== 'current'
    ? `<div class="ev-status-warning">⚠ ${escapeHtml(s.status.replace(/-/g, ' '))}${s.status_notes ? ': ' + escapeHtml(s.status_notes) : ''}</div>`
    : '';
  return `
    <div class="evidence-card dir-${dir}">
      <div class="ev-title">${escapeHtml(s.title || '(untitled)')}</div>
      <div class="ev-badges">
        ${s.source_venue ? `<span class="ev-badge venue-${s.source_venue}">${escapeHtml(s.source_venue)}</span>` : ''}
        ${s.source_type ? `<span class="ev-badge type-${s.source_type}">${escapeHtml(s.source_type)}</span>` : ''}
        ${showStrength && s.strength ? `<span class="ev-badge strength-${s.strength}">${escapeHtml(s.strength)}</span>` : ''}
        ${s.date ? `<span class="ev-badge ev-date">${escapeHtml(s.date.slice(0, 10))}</span>` : ''}
      </div>
      ${statusBadge}
      ${s.description ? `<div class="ev-description">${escapeHtml(s.description)}</div>` : ''}
      ${s.notes ? `<div class="ev-notes">${escapeHtml(s.notes)}</div>` : ''}
      ${(verifyBadge(s) || archiveBadge(s) || provenanceBadge(s)) ? `<div style="margin-bottom:0.4rem;">${provenanceBadge(s)}${verifyBadge(s)}${archiveBadge(s)}</div>` : ''}
      ${s.source_url ? `<div class="ev-link"><a href="${escapeHtml(s.source_url)}" target="_blank" rel="noopener">↗ ${escapeHtml(s.source_url)}</a></div>` : ''}
    </div>
  `;
}

function renderTaxonomic(fp) {
  const panel = document.querySelector('[data-panel=taxonomic]');
  const t = fp.taxonomic || {};
  panel.innerHTML = `
    <div class="card">
      <h2>Domain</h2>
      <span class="pill domain">${escapeHtml(t.domain || 'other')}</span>
      <span style="color:#777; font-size:0.85rem; margin-left:0.6rem;">confidence: ${t.domain_confidence ?? 0}</span>
    </div>
    <div class="card">
      <h2>Tropes</h2>
      ${(t.tropes || []).map(tp => `<span class="pill trope">${escapeHtml(tp)}</span>`).join('') || '<p class="empty">None invoked</p>'}
    </div>
    <div class="card">
      <h2>Inductive Cluster IDs</h2>
      ${(t.inductive_cluster_ids || []).length
        ? (t.inductive_cluster_ids || []).map(c => `<span class="pill">${escapeHtml(c)}</span>`).join('')
        : '<p class="empty">Not yet generated — cross-corpus clustering is a deferred feature.</p>'}
    </div>
  `;
}
