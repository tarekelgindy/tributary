<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tributary Fingerprint Viewer</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #fafaf7;
  color: #222;
  line-height: 1.5;
}

#drop-zone {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 2rem;
  border: 2px dashed #ccc;
  transition: background-color 0.2s;
}
#drop-zone.dragover { background: #f0eee5; border-color: #888; }
#drop-zone h1 { margin: 0 0 0.5rem; font-weight: 500; font-size: 2rem; }
#drop-zone p { color: #666; margin: 0 0 1.5rem; max-width: 560px; }
#drop-zone input[type=file] { display: none; }
#drop-zone label {
  cursor: pointer; padding: 0.6rem 1.4rem;
  background: #444; color: white; border-radius: 4px;
  font-size: 0.9rem;
}
#drop-zone label:hover { background: #222; }
#error { color: #b00; margin-top: 1rem; min-height: 1.4rem; }

header {
  background: white;
  padding: 1.5rem 2rem;
  border-bottom: 1px solid #eee;
}
header h1 { margin: 0 0 0.4rem; font-size: 1.5rem; font-weight: 500; }
#meta-bar { color: #777; font-size: 0.85rem; font-family: 'SF Mono', Menlo, monospace; }
#meta-bar span { margin-right: 1.2rem; }
#meta-bar strong { color: #555; font-weight: 500; }

#tabs {
  background: white;
  padding: 0 2rem;
  border-bottom: 1px solid #eee;
  display: flex;
  gap: 0;
  overflow-x: auto;
}
#tabs button {
  border: none;
  background: none;
  padding: 0.8rem 1.2rem;
  cursor: pointer;
  font-size: 0.9rem;
  color: #666;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
  white-space: nowrap;
}
#tabs button:hover { color: #222; }
#tabs button.active { color: #222; border-bottom-color: #444; font-weight: 500; }

main { padding: 2rem; max-width: 1200px; margin: 0 auto; }
section { animation: fadein 0.2s; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

.card {
  background: white;
  border: 1px solid #e5e5e5;
  border-radius: 6px;
  padding: 1.2rem;
  margin-bottom: 1rem;
}
.card h2 {
  margin: 0 0 0.6rem; font-size: 0.85rem;
  font-weight: 500; color: #555;
  text-transform: uppercase; letter-spacing: 0.06em;
}
.card p { margin: 0 0 0.6rem; }
.card .title-line { font-weight: 500; }

.pill {
  display: inline-block;
  padding: 0.2rem 0.7rem;
  margin: 0.15rem 0.3rem 0.15rem 0;
  background: #efece4;
  color: #333;
  border-radius: 999px;
  font-size: 0.85rem;
}
.pill.diagnostic { background: #f4ddc4; color: #6a3a06; font-weight: 500; }
.pill.frame { background: #d8e2ee; color: #2a4669; }
.pill.trope { background: #e6dcec; color: #4f2c5a; }
.pill.domain { background: #d4e3d5; color: #1e4427; font-size: 1rem; padding: 0.3rem 0.9rem; }

.summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 1rem;
}

.entity-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 0.6rem;
  margin-top: 0.4rem;
}
.entity-grid > div {
  padding: 0.6rem 0.9rem;
  background: #faf7ef;
  border-radius: 4px;
}
.entity-grid .label {
  font-size: 0.7rem; color: #888;
  text-transform: uppercase; letter-spacing: 0.05em;
  margin-bottom: 0.15rem;
}
.entity-grid .value { color: #222; }

.role-legend {
  display: flex; flex-wrap: wrap; gap: 1rem;
  margin-bottom: 1.4rem; padding: 0.7rem 1rem;
  background: white; border: 1px solid #e5e5e5; border-radius: 6px;
  font-size: 0.82rem;
}
.role-legend div { display: flex; align-items: center; gap: 0.4rem; }
.role-legend .dot { width: 0.7rem; height: 0.7rem; border-radius: 50%; }

.timeline-block { margin-bottom: 1.8rem; }
.timeline-block .timeline-header {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 0.4rem; flex-wrap: wrap;
}
.timeline-block h2 {
  margin: 0; font-size: 0.85rem; font-weight: 500;
  color: #555; text-transform: uppercase; letter-spacing: 0.06em;
}
.timeline-block .timeline-info { font-size: 0.82rem; color: #777; }
.timeline-svg {
  width: 100%; height: 90px;
  background: white; border: 1px solid #e5e5e5; border-radius: 6px;
}

.detail-card {
  background: white;
  border: 1px solid #e5e5e5;
  border-left: 4px solid #888;
  border-radius: 6px;
  padding: 1rem 1.2rem;
  margin: 1rem 0;
}
.detail-card.role-originator { border-left-color: #c0392b; }
.detail-card.role-early-amplifier { border-left-color: #d68f1a; }
.detail-card.role-mass-amplifier { border-left-color: #f0a500; }
.detail-card.role-institutional-adoption { border-left-color: #2a6fa3; }
.detail-card.role-critic { border-left-color: #6f3e8e; }
.detail-card.role-mention { border-left-color: #888; }
.detail-card .head {
  display: flex; justify-content: space-between; align-items: baseline;
  flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.4rem;
}
.detail-card .date {
  font-family: 'SF Mono', Menlo, monospace;
  color: #555; font-size: 0.9rem;
}
.detail-card .role-tag {
  font-size: 0.72rem; padding: 0.15rem 0.6rem;
  border-radius: 999px; background: #eee; color: #555;
  text-transform: uppercase; letter-spacing: 0.05em;
}
.detail-card .role-tag.originator { background: #fad7d1; color: #832018; }
.detail-card .role-tag.early-amplifier { background: #f7e0bb; color: #6a4308; }
.detail-card .role-tag.mass-amplifier { background: #fae7b8; color: #6a4d06; }
.detail-card .role-tag.institutional-adoption { background: #cfe0ee; color: #1b486f; }
.detail-card .role-tag.critic { background: #e2d2ec; color: #4a275a; }
.detail-card .role-tag.mention { background: #eaeaea; color: #444; }
.detail-card .role-tag.unknown { background: #eaeaea; color: #666; }
.detail-card .title-line { font-weight: 500; margin-bottom: 0.3rem; }
.detail-card .author { color: #666; font-size: 0.9rem; margin-bottom: 0.6rem; }
.detail-card .quote {
  padding: 0.6rem 0.9rem; background: #faf7ef;
  border-radius: 4px; font-style: italic; color: #333;
  margin-bottom: 0.6rem;
}
.detail-card .field { font-size: 0.85rem; color: #555; margin-top: 0.5rem; }
.detail-card .field .label {
  font-weight: 500; color: #444;
  text-transform: uppercase; font-size: 0.68rem;
  letter-spacing: 0.06em; display: block; margin-bottom: 0.15rem;
}
.detail-card a { color: #2a6fa3; text-decoration: none; word-break: break-all; }
.detail-card a:hover { text-decoration: underline; }

.collapse {
  background: white; border: 1px solid #e5e5e5;
  border-radius: 6px; margin-bottom: 1rem;
}
.collapse summary {
  padding: 0.7rem 1.2rem; cursor: pointer;
  font-weight: 500; font-size: 0.9rem; color: #444;
}
.collapse[open] summary { border-bottom: 1px solid #eee; }
.collapse .body {
  padding: 1rem 1.2rem; font-size: 0.85rem;
  color: #444; white-space: pre-wrap; line-height: 1.6;
}
.collapse .body.normal-text { white-space: normal; }

.mutation-card {
  background: #fafaf7;
  border: 1px solid #e5e5e5;
  border-radius: 5px;
  padding: 0.8rem 1rem;
  margin-bottom: 0.7rem;
}
.mutation-head {
  font-family: 'SF Mono', Menlo, monospace;
  font-size: 0.82rem;
  color: #555;
  margin-bottom: 0.6rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid #ececec;
}
.mutation-arrow {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  flex-wrap: wrap;
}
.mutation-arrow .arrow {
  color: #aaa;
  font-weight: bold;
}
.mutation-field {
  display: flex;
  gap: 0.7rem;
  margin: 0.35rem 0;
  font-size: 0.87rem;
  line-height: 1.55;
}
.mutation-label {
  flex-shrink: 0;
  width: 5.6rem;
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding-top: 0.15rem;
}
.mutation-field.preserved .mutation-label { color: #2e7d32; }
.mutation-field.dropped   .mutation-label { color: #757575; }
.mutation-field.added     .mutation-label { color: #1976d2; }
.mutation-field.distorted .mutation-label { color: #c45719; }
.mutation-field .mutation-text { color: #333; }

.timeline-stats-card { margin-bottom: 1.8rem; }
.timeline-stats-card h2 {
  margin: 0 0 0.7rem; font-size: 0.85rem; font-weight: 500;
  color: #555; text-transform: uppercase; letter-spacing: 0.06em;
}
.stats-chart {
  width: 100%; height: 110px;
  background: #fafaf7; border: 1px solid #ececec; border-radius: 4px;
  margin-top: 0.8rem;
}
.stats-chart text.tick { fill: #888; font-size: 10px; font-family: 'SF Mono', Menlo, monospace; }
.stats-chart rect:hover { opacity: 0.75; }

.social-card { margin-bottom: 1.8rem; }
.social-summary {
  display: flex; gap: 1.4rem; flex-wrap: wrap;
  margin-bottom: 0.8rem; font-size: 0.85rem; color: #555;
}
.social-summary strong { color: #222; }
.social-note {
  font-size: 0.82rem; color: #777;
  padding: 0.5rem 0.7rem; background: #faf7ef;
  border-radius: 4px; margin-bottom: 0.8rem;
}
.social-post {
  border: 1px solid #ececec;
  border-left: 3px solid #888;
  border-radius: 4px;
  padding: 0.7rem 0.9rem;
  margin-bottom: 0.5rem;
  font-size: 0.88rem;
}
.social-post.role-originator { border-left-color: #c0392b; }
.social-post.role-early-amplifier { border-left-color: #d68f1a; }
.social-post.role-mass-amplifier { border-left-color: #f0a500; }
.social-post.role-institutional-adoption { border-left-color: #2a6fa3; }
.social-post.role-critic { border-left-color: #6f3e8e; }
.social-post.role-mention { border-left-color: #888; }
.social-post .post-head {
  display: flex; gap: 0.6rem; align-items: baseline;
  margin-bottom: 0.3rem; flex-wrap: wrap;
}
.social-post .post-author { font-weight: 500; color: #2a6fa3; font-family: 'SF Mono', Menlo, monospace; font-size: 0.82rem; }
.social-post .post-date { color: #888; font-family: 'SF Mono', Menlo, monospace; font-size: 0.78rem; }
.social-post .post-engagement { color: #888; font-size: 0.78rem; margin-left: auto; }
.social-post .post-text { color: #333; line-height: 1.5; margin-bottom: 0.4rem; white-space: pre-wrap; word-break: break-word; }
.social-post .post-role { font-size: 0.75rem; color: #555; padding-top: 0.4rem; border-top: 1px solid #f0f0f0; }
.social-post .post-role .role-tag { padding: 0.1rem 0.5rem; border-radius: 999px; font-size: 0.72rem; }
.social-post .post-role .role-tag.originator { background: #fad7d1; color: #832018; }
.social-post .post-role .role-tag.early-amplifier { background: #f7e0bb; color: #6a4308; }
.social-post .post-role .role-tag.mass-amplifier { background: #fae7b8; color: #6a4d06; }
.social-post .post-role .role-tag.institutional-adoption { background: #cfe0ee; color: #1b486f; }
.social-post .post-role .role-tag.critic { background: #e2d2ec; color: #4a275a; }
.social-post .post-role .role-tag.mention { background: #eaeaea; color: #444; }
.social-post .post-role .role-tag.unknown { background: #eaeaea; color: #666; }
.social-post a { color: #2a6fa3; text-decoration: none; }
.social-post a:hover { text-decoration: underline; }

.evidence-summary {
  background: white; border: 1px solid #e5e5e5; border-radius: 6px;
  padding: 1rem 1.2rem; margin-bottom: 1.4rem;
  font-size: 0.95rem; line-height: 1.55; color: #333;
}
.evidence-summary h2 {
  margin: 0 0 0.5rem; font-size: 0.85rem; font-weight: 500;
  color: #555; text-transform: uppercase; letter-spacing: 0.06em;
}
.evidence-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
  gap: 1rem;
  margin-bottom: 1.4rem;
}
.evidence-column {
  background: white; border: 1px solid #e5e5e5; border-radius: 6px;
  padding: 1rem;
}
.evidence-column h2 {
  margin: 0 0 0.6rem; font-size: 0.82rem; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.06em;
  padding-bottom: 0.4rem; border-bottom: 1px solid #f0f0f0;
}
.evidence-column.supports h2 { color: #6a4d06; }
.evidence-column.disputes h2 { color: #1b486f; }
.evidence-column.redirects h2 { color: #4a275a; }
.evidence-column.shared-context h2 { color: #1e4427; }

.evidence-card {
  background: #fafaf7;
  border: 1px solid #ececec;
  border-left: 3px solid #888;
  border-radius: 4px;
  padding: 0.7rem 0.9rem;
  margin-bottom: 0.6rem;
  font-size: 0.88rem;
}
.evidence-card.dir-supports { border-left-color: #f0a500; }
.evidence-card.dir-disputes { border-left-color: #2a6fa3; }
.evidence-card.dir-redirects { border-left-color: #6f3e8e; }
.evidence-card.dir-shared-context { border-left-color: #2e7d32; }

.evidence-card .ev-title { font-weight: 500; margin-bottom: 0.35rem; color: #222; }
.evidence-card .ev-badges {
  display: flex; flex-wrap: wrap; gap: 0.3rem; margin-bottom: 0.45rem;
}
.evidence-card .ev-badge {
  font-size: 0.7rem; padding: 0.1rem 0.5rem;
  border-radius: 999px; background: #eee; color: #555;
}
.evidence-card .ev-badge.venue-peer-reviewed { background: #cfe0ee; color: #1b486f; }
.evidence-card .ev-badge.venue-institutional { background: #d4e3d5; color: #1e4427; }
.evidence-card .ev-badge.venue-news-outlet { background: #efece4; color: #4d3d18; }
.evidence-card .ev-badge.venue-opinion-venue { background: #e6dcec; color: #4f2c5a; }
.evidence-card .ev-badge.venue-aggregator { background: #eaeaea; color: #444; }
.evidence-card .ev-badge.venue-preprint-server { background: #d6e3ee; color: #1f3f5e; }
.evidence-card .ev-badge.venue-self-published { background: #f0e1ea; color: #4f2a44; }
.evidence-card .ev-badge.type-primary { background: #f7e0bb; color: #6a4308; font-weight: 600; }
.evidence-card .ev-badge.type-secondary { background: #eaeaea; color: #555; }
.evidence-card .ev-badge.type-tertiary { background: #f1eeea; color: #6a5a4a; }
.evidence-card .ev-badge.strength-strong { background: #d7e8d8; color: #1e4427; font-weight: 600; }
.evidence-card .ev-badge.strength-moderate { background: #ece8da; color: #4f4530; }
.evidence-card .ev-badge.strength-weak { background: #efe6da; color: #6a4d2b; }
.evidence-card .ev-badge.ev-date { background: #f5f5f0; color: #777; font-family: 'SF Mono', Menlo, monospace; }
.evidence-card .ev-status-warning {
  display: inline-block; padding: 0.15rem 0.55rem;
  background: #f7d7d2; color: #832018;
  border-radius: 999px; font-size: 0.72rem; font-weight: 600;
  margin-bottom: 0.4rem;
}
.evidence-card .ev-description { color: #333; margin-bottom: 0.35rem; line-height: 1.45; }
.evidence-card .ev-notes { font-size: 0.82rem; color: #666; margin-bottom: 0.4rem; font-style: italic; }
.evidence-card .ev-link a {
  color: #2a6fa3; text-decoration: none;
  font-size: 0.82rem; word-break: break-all;
}
.evidence-card .ev-link a:hover { text-decoration: underline; }

/* Verification badges — used on evidence cards, detail cards, and social posts */
.verify-badge {
  display: inline-block; padding: 0.1rem 0.5rem;
  border-radius: 999px; font-size: 0.72rem; font-weight: 500;
  margin-right: 0.3rem;
}
.verify-badge.verified            { background: #d4e8d6; color: #1e5128; }
.verify-badge.unchecked           { background: #eaeaea; color: #666; }
.verify-badge.url-error           { background: #fad7d1; color: #832018; }
.verify-badge.fetch-error         { background: #fad7d1; color: #832018; }
.verify-badge.quote-not-found     { background: #f9e5c0; color: #6a4308; }
.archive-link {
  display: inline-block; padding: 0.1rem 0.5rem;
  background: #e6dcec; color: #4f2c5a;
  border-radius: 999px; font-size: 0.72rem;
  margin-right: 0.3rem; text-decoration: none;
}
.archive-link:hover { text-decoration: underline; }

.empty { color: #999; font-style: italic; margin: 0; }
code { font-family: 'SF Mono', Menlo, monospace; background: #f1ede2; padding: 0.15rem 0.4rem; border-radius: 3px; }

circle.instance { cursor: pointer; transition: opacity 0.1s; }
circle.instance:hover { opacity: 0.7; }
.tick { fill: #aaa; font-size: 10px; font-family: 'SF Mono', Menlo, monospace; }
.lineage-line { stroke: #ddd; stroke-width: 1; }
</style>
</head>
<body>

<div id="drop-zone">
  <h1>Tributary Fingerprint Viewer</h1>
  <p>Drag a fingerprint JSON file here, or click to browse. Self-contained — runs entirely in your browser, no data leaves your machine.</p>
  <label for="file-input">Browse...</label>
  <input type="file" id="file-input" accept="application/json,.json">
  <div id="error"></div>
</div>

<div id="viewer" hidden>
  <header>
    <h1 id="claim-phrase"></h1>
    <div id="meta-bar"></div>
  </header>

  <nav id="tabs">
    <button data-tab="overview" class="active">Overview</button>
    <button data-tab="lexical">L1 Lexical</button>
    <button data-tab="conceptual">L2 Conceptual</button>
    <button data-tab="rhetorical">L3 Rhetorical</button>
    <button data-tab="lineages">L4 Lineages</button>
    <button data-tab="evidence">Evidence</button>
    <button data-tab="taxonomic">L5 Taxonomic</button>
  </nav>

  <main>
    <section data-panel="overview"></section>
    <section data-panel="lexical" hidden></section>
    <section data-panel="conceptual" hidden></section>
    <section data-panel="rhetorical" hidden></section>
    <section data-panel="lineages" hidden></section>
    <section data-panel="evidence" hidden></section>
    <section data-panel="taxonomic" hidden></section>
  </main>
</div>

<script>
const ROLE_COLORS = {
  'originator':              '#c0392b',
  'early-amplifier':         '#d68f1a',
  'mass-amplifier':          '#f0a500',
  'institutional-adoption':  '#2a6fa3',
  'critic':                  '#6f3e8e',
  'mention':                 '#888',
  'unknown':                 '#bbb',
};
const ROLE_ORDER = ['originator','early-amplifier','mass-amplifier','institutional-adoption','critic','mention','unknown'];

let currentFP = null;

const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const errorDiv = document.getElementById('error');
const viewer = document.getElementById('viewer');

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => { if (e.target.files.length) loadFile(e.target.files[0]); });

function loadFile(file) {
  errorDiv.textContent = '';
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const fp = JSON.parse(reader.result);
      if (!fp.fingerprint_id || !fp.lexical) {
        throw new Error('Not a recognizable fingerprint JSON — missing fingerprint_id or lexical layer');
      }
      render(fp);
    } catch (e) {
      errorDiv.textContent = 'Failed to load: ' + e.message;
    }
  };
  reader.onerror = () => { errorDiv.textContent = 'File read error.'; };
  reader.readAsText(file);
}

function render(fp) {
  currentFP = fp;
  dropZone.hidden = true;
  viewer.hidden = false;

  document.getElementById('claim-phrase').textContent =
    fp.lexical.canonical_phrase || '(no canonical phrase)';

  const meta = document.getElementById('meta-bar');
  meta.innerHTML = '';
  addMeta(meta, 'id', fp.fingerprint_id);
  addMeta(meta, 'created', (fp.created_at || '').split('T')[0]);
  const scope = fp.scope || {};
  const window = (scope.time_window_start || '—') + ' to ' + (scope.time_window_end || 'present');
  addMeta(meta, 'scope', `${scope.language || 'en'} · ${scope.region || 'global'} · ${window}`);
  addMeta(meta, 'schema', fp.taxonomy_version || '?');

  renderOverview(fp);
  renderLexical(fp);
  renderConceptual(fp);
  renderRhetorical(fp);
  renderLineages(fp);
  renderEvidence(fp);
  renderTaxonomic(fp);

  document.querySelectorAll('#tabs button').forEach(btn => {
    btn.onclick = () => switchTab(btn.dataset.tab);
  });
  switchTab('overview');
}

function addMeta(parent, label, value) {
  const span = document.createElement('span');
  span.innerHTML = `<strong>${escapeHtml(label)}:</strong> ${escapeHtml(value || '')}`;
  parent.appendChild(span);
}

function switchTab(name) {
  document.querySelectorAll('#tabs button').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('section[data-panel]').forEach(s =>
    s.hidden = s.dataset.panel !== name);
  // Redraw timelines on activation; SVG clientWidth is 0 while hidden, so
  // we have to draw after the panel is visible.
  if (name === 'lineages' && currentFP) {
    const lex = currentFP.genealogy?.lexical?.attestation_log || [];
    const con = currentFP.genealogy?.conceptual?.attestation_log || [];
    const lexStats = currentFP.genealogy?.lexical?.timeline_stats || {};
    const conStats = currentFP.genealogy?.conceptual?.timeline_stats || {};
    requestAnimationFrame(() => {
      drawTimeline('timeline-lexical', lex);
      drawTimeline('timeline-conceptual', con);
      drawStatsChart('stats-lexical', lexStats);
      drawStatsChart('stats-conceptual', conStats);
    });
  }
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function instancesByRole(log) {
  const grouped = {};
  ROLE_ORDER.forEach(r => grouped[r] = []);
  (log || []).forEach(i => {
    const r = i.amplifier_role || 'unknown';
    if (grouped[r]) grouped[r].push(i); else grouped.unknown.push(i);
  });
  return grouped;
}

function instanceLine(i) {
  return `<div style="margin: 0.4rem 0; font-size: 0.92rem;">
    <strong>${escapeHtml(i.date || '?')}</strong> · ${escapeHtml(i.author || '')} — ${escapeHtml(i.source_title || '')}
  </div>`;
}

function truncate(s, max) {
  s = String(s || '');
  return s.length > max ? s.slice(0, max - 3) + '...' : s;
}

function verifyBadge(item) {
  // item is any object with verification fields (InformationSource,
  // AttestedInstance, SocialAttestedInstance). Returns badge HTML or ''
  // if the item predates the verification feature (status: 'unchecked'
  // with no notes — likely an old fingerprint).
  const status = item.verification_status || 'unchecked';
  const notes = item.verification_notes || '';
  if (status === 'unchecked' && !notes) return '';
  const symbol = {
    'verified': '✓ verified',
    'unchecked': '↻ unchecked',
    'url-error': '✗ URL error',
    'fetch-error': '✗ fetch error',
    'quote-not-found': '⚠ quote not found',
  }[status] || status;
  const tooltipParts = [status];
  if (notes) tooltipParts.push(notes);
  const tooltip = tooltipParts.join(' — ');
  return `<span class="verify-badge ${escapeHtml(status)}" title="${escapeHtml(tooltip)}">${escapeHtml(symbol)}</span>`;
}

function archiveBadge(item) {
  const archive = item.archive_url || '';
  if (!archive) return '';
  return `<a href="${escapeHtml(archive)}" target="_blank" rel="noopener" class="archive-link" title="Wayback snapshot">📦 archive</a>`;
}

function fmtDaysHuman(d) {
  if (d == null) return '—';
  if (d < 730) return `${d.toLocaleString()} days`;
  return `${d.toLocaleString()} days (${(d / 365).toFixed(1)} years)`;
}

function renderSocialSpread(lineage) {
  if (!lineage.social_search_performed) return '';
  const posts = lineage.social_spread || [];
  const notes = lineage.social_search_notes || '';

  // Compute simple aggregate stats for the header
  const totalEngagement = posts.reduce(
    (acc, p) => acc + (p.likes || 0) + (p.reposts || 0), 0
  );
  const uniqueAuthors = new Set(posts.map(p => p.author_handle)).size;
  const roleCounts = {};
  posts.forEach(p => {
    const r = p.amplifier_role || 'unknown';
    roleCounts[r] = (roleCounts[r] || 0) + 1;
  });

  // Sort posts: by engagement desc so most-impactful surface first
  const sortedPosts = [...posts].sort(
    (a, b) => ((b.likes || 0) + (b.reposts || 0)) - ((a.likes || 0) + (a.reposts || 0))
  );

  const postsHtml = sortedPosts.map(p => {
    const role = p.amplifier_role || 'unknown';
    const engagement = `${p.likes || 0} likes · ${p.reposts || 0} reposts${p.replies ? ` · ${p.replies} replies` : ''}`;
    return `
      <div class="social-post role-${role}">
        <div class="post-head">
          <span class="post-author">@${escapeHtml(p.author_handle || '?')}</span>
          <span class="post-date">${escapeHtml((p.post_date || '').slice(0, 10))}</span>
          <span class="post-engagement">${escapeHtml(engagement)}</span>
        </div>
        <div class="post-text">${escapeHtml(p.post_text || '')}</div>
        <div class="post-role">
          <span class="role-tag ${role}">${escapeHtml(role)}</span>
          ${p.role_evidence ? ` <span style="color:#666;">— ${escapeHtml(p.role_evidence)}</span>` : ''}
          ${verifyBadge(p)}${archiveBadge(p)}
          ${p.post_url ? `<a href="${escapeHtml(p.post_url)}" target="_blank" rel="noopener" style="float:right;">↗ open</a>` : ''}
        </div>
      </div>
    `;
  }).join('');

  const roleBreakdown = Object.entries(roleCounts)
    .sort((a, b) => b[1] - a[1])
    .map(([r, c]) => `${r}: ${c}`).join(' · ');

  return `
    <div class="card social-card">
      <h2>Social Spread (Bluesky)</h2>
      ${notes ? `<div class="social-note">${escapeHtml(notes)}</div>` : ''}
      ${posts.length === 0 ? `<p class="empty">No posts found.</p>` : `
        <div class="social-summary">
          <div><strong>${posts.length}</strong> posts</div>
          <div><strong>${uniqueAuthors}</strong> unique authors</div>
          <div><strong>${totalEngagement.toLocaleString()}</strong> total engagement</div>
          <div style="color:#777;">${escapeHtml(roleBreakdown)}</div>
        </div>
        <details class="collapse" style="margin-top:0.5rem;">
          <summary>Posts (sorted by engagement)</summary>
          <div class="body normal-text">
            ${postsHtml}
          </div>
        </details>
      `}
    </div>
  `;
}

function drawStatsChart(svgId, stats) {
  const svg = document.getElementById(svgId);
  if (!svg || !stats || !stats.instances_per_year_by_role) return;
  svg.innerHTML = '';

  const ns = 'http://www.w3.org/2000/svg';
  const width = svg.clientWidth || 800;
  const height = 110;
  const padding = 30;
  const chartHeight = height - 28;       // leave room for x-axis labels

  const yearKeys = Object.keys(stats.instances_per_year_by_role)
    .map(Number).filter(y => !Number.isNaN(y));
  if (yearKeys.length === 0) return;

  yearKeys.sort((a, b) => a - b);
  const minYear = yearKeys[0];
  const maxYear = yearKeys[yearKeys.length - 1];
  const range = Math.max(1, maxYear - minYear);
  const maxCount = Math.max(...Object.values(stats.instances_per_year || {}));

  // Bar width auto-scales — narrow bars for wide spans (e.g. 1377-2023),
  // chunkier bars for compact ones (e.g. 1992-2018).
  const barWidth = Math.max(2, (width - 2 * padding) / Math.max(range, 10));

  Object.entries(stats.instances_per_year_by_role).forEach(([yearStr, byRole]) => {
    const year = Number(yearStr);
    if (Number.isNaN(year)) return;
    const x = padding + ((year - minYear) / range) * (width - 2 * padding);
    let stackedHeight = 0;
    ROLE_ORDER.forEach(role => {
      const count = byRole[role] || 0;
      if (count === 0) return;
      const segHeight = (count / maxCount) * chartHeight;
      const rect = document.createElementNS(ns, 'rect');
      rect.setAttribute('x', x - barWidth / 2);
      rect.setAttribute('y', chartHeight - stackedHeight - segHeight);
      rect.setAttribute('width', barWidth);
      rect.setAttribute('height', segHeight);
      rect.setAttribute('fill', ROLE_COLORS[role] || ROLE_COLORS.unknown);
      const title = document.createElementNS(ns, 'title');
      title.textContent = `${year} · ${role}: ${count}`;
      rect.appendChild(title);
      svg.appendChild(rect);
      stackedHeight += segHeight;
    });
  });

  // Axis ticks
  const tickCount = 5;
  for (let i = 0; i <= tickCount; i++) {
    const x = padding + ((width - 2 * padding) * i / tickCount);
    const year = Math.round(minYear + (range * i / tickCount));
    const text = document.createElementNS(ns, 'text');
    text.setAttribute('x', x);
    text.setAttribute('y', chartHeight + 16);
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('class', 'tick');
    text.textContent = year;
    svg.appendChild(text);
  }
}

function renderMutationsBlock(label, mutations, instances) {
  if (!mutations || mutations.length === 0) return '';

  // Look up the from/to instances by URL so each card can show author + date
  const byUrl = {};
  (instances || []).forEach(i => { byUrl[i.source_url] = i; });

  const cards = mutations.map(m => {
    const from = byUrl[m.from_source] || {};
    const to = byUrl[m.to_source] || {};
    const fields = [];
    if (m.preserved) fields.push(['preserved', 'Preserved', m.preserved]);
    if (m.dropped) fields.push(['dropped', 'Dropped', m.dropped]);
    if (m.added) fields.push(['added', 'Added', m.added]);
    if (m.distorted) fields.push(['distorted', 'Distorted', m.distorted]);
    return `
      <div class="mutation-card">
        <div class="mutation-head">
          <div class="mutation-arrow">
            <span>${escapeHtml(from.date || '?')} · ${escapeHtml(truncate(from.author, 48))}</span>
            <span class="arrow">→</span>
            <span>${escapeHtml(to.date || '?')} · ${escapeHtml(truncate(to.author, 48))}</span>
          </div>
        </div>
        <div class="mutation-body">
          ${fields.map(([cls, lbl, text]) => `
            <div class="mutation-field ${cls}">
              <span class="mutation-label">${lbl}</span>
              <span class="mutation-text">${escapeHtml(text)}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');

  return `
    <details class="collapse">
      <summary>${label} mutations (${mutations.length})</summary>
      <div class="body normal-text">
        <p style="color:#777; font-size:0.82rem; margin: 0 0 1rem;">How the framing changed across significant transitions in this lineage.</p>
        ${cards}
      </div>
    </details>
  `;
}

function drawTimeline(svgId, instances) {
  const svg = document.getElementById(svgId);
  if (!svg) return;
  svg.innerHTML = '';
  const ns = 'http://www.w3.org/2000/svg';
  const width = svg.clientWidth || 800;
  const height = 90;
  const padding = 36;
  const axisY = height / 2;

  if (!instances.length) {
    const text = document.createElementNS(ns, 'text');
    text.setAttribute('x', '50%'); text.setAttribute('y', '50%');
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('fill', '#aaa');
    text.setAttribute('font-size', '12');
    text.textContent = 'No instances';
    svg.appendChild(text);
    return;
  }

  const datedInstances = instances
    .map(i => ({ ...i, year: parseYear(i.date) }))
    .filter(i => i.year != null);

  if (datedInstances.length === 0) {
    const text = document.createElementNS(ns, 'text');
    text.setAttribute('x', '50%'); text.setAttribute('y', '50%');
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('fill', '#aaa');
    text.setAttribute('font-size', '12');
    text.textContent = 'No dated instances';
    svg.appendChild(text);
    return;
  }

  const years = datedInstances.map(i => i.year);
  const minYear = Math.min(...years);
  const maxYear = Math.max(...years);
  const range = Math.max(1, maxYear - minYear);

  // Axis line
  const line = document.createElementNS(ns, 'line');
  line.setAttribute('x1', padding); line.setAttribute('x2', width - padding);
  line.setAttribute('y1', axisY); line.setAttribute('y2', axisY);
  line.setAttribute('class', 'lineage-line');
  svg.appendChild(line);

  // Year ticks
  const tickCount = 5;
  for (let i = 0; i <= tickCount; i++) {
    const x = padding + ((width - 2 * padding) * i / tickCount);
    const year = Math.round(minYear + (range * i / tickCount));
    const tick = document.createElementNS(ns, 'line');
    tick.setAttribute('x1', x); tick.setAttribute('x2', x);
    tick.setAttribute('y1', axisY - 4); tick.setAttribute('y2', axisY + 4);
    tick.setAttribute('stroke', '#bbb');
    svg.appendChild(tick);
    const text = document.createElementNS(ns, 'text');
    text.setAttribute('x', x); text.setAttribute('y', axisY + 24);
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('class', 'tick');
    text.textContent = year;
    svg.appendChild(text);
  }

  // Group dots by x position (within 8px) and stack vertically when overlapping
  const bucketed = {};
  datedInstances.forEach(inst => {
    const x = padding + ((inst.year - minYear) / range) * (width - 2 * padding);
    const key = Math.round(x / 8) * 8;
    (bucketed[key] = bucketed[key] || []).push({ inst, x });
  });

  Object.values(bucketed).forEach(bucket => {
    bucket.forEach(({ inst, x }, idx) => {
      const verticalOffset = (idx - (bucket.length - 1) / 2) * 12;
      const role = inst.amplifier_role || 'unknown';
      const color = ROLE_COLORS[role] || ROLE_COLORS.unknown;
      const circle = document.createElementNS(ns, 'circle');
      circle.setAttribute('cx', x);
      circle.setAttribute('cy', axisY - 18 + verticalOffset);
      circle.setAttribute('r', 5);
      circle.setAttribute('fill', color);
      circle.setAttribute('stroke', 'white');
      circle.setAttribute('stroke-width', 1.5);
      circle.setAttribute('class', 'instance');
      const tooltip = `${inst.date || '?'} · ${(inst.author || 'unknown')} · ${role}`;
      const title = document.createElementNS(ns, 'title');
      title.textContent = tooltip;
      circle.appendChild(title);
      circle.addEventListener('click', () => showDetail(inst));
      svg.appendChild(circle);
    });
  });
}

function parseYear(dateStr) {
  if (!dateStr) return null;
  const m = String(dateStr).match(/^(\d{4})/);
  return m ? parseInt(m[1], 10) : null;
}

function showDetail(inst) {
  const role = inst.amplifier_role || 'unknown';
  const detail = document.getElementById('instance-detail');
  detail.innerHTML = `
    <div class="detail-card role-${role}">
      <div class="head">
        <span class="date">${escapeHtml(inst.date || '?')}</span>
        <span class="role-tag ${role}">${escapeHtml(role)}</span>
      </div>
      <div class="title-line">${escapeHtml(inst.source_title || '')}</div>
      <div class="author">${escapeHtml(inst.author || '')}</div>
      ${inst.exact_quote ? `<div class="quote">"${escapeHtml(inst.exact_quote)}"</div>` : ''}
      ${inst.lexical_form_seen ? `<div class="field"><span class="label">Form seen</span>${escapeHtml(inst.lexical_form_seen)}</div>` : ''}
      ${inst.evidence ? `<div class="field"><span class="label">Evidence</span>${escapeHtml(inst.evidence)}</div>` : ''}
      ${inst.role_evidence ? `<div class="field"><span class="label">Role evidence</span>${escapeHtml(inst.role_evidence)}</div>` : ''}
      ${inst.confidence != null ? `<div class="field"><span class="label">Confidence</span>${inst.confidence}</div>` : ''}
      ${(verifyBadge(inst) || archiveBadge(inst)) ? `<div class="field"><span class="label">Verification</span>${verifyBadge(inst)}${archiveBadge(inst)}</div>` : ''}
      ${inst.source_url ? `<div class="field"><span class="label">Source</span><a href="${escapeHtml(inst.source_url)}" target="_blank" rel="noopener">${escapeHtml(inst.source_url)}</a></div>` : ''}
    </div>
  `;
  detail.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function renderEvidence(fp) {
  const panel = document.querySelector('[data-panel=evidence]');
  const ev = fp.evidence_landscape || {};
  const sources = ev.sources || [];

  if (sources.length === 0 && !ev.summary) {
    panel.innerHTML = `
      <div class="card">
        <p class="empty">Evidence landscape was not generated for this fingerprint (use --no-evidence to skip; or this is an older fingerprint that predates the feature).</p>
      </div>`;
    return;
  }

  const byDirection = { supports: [], disputes: [], redirects: [], 'shared-context': [] };
  sources.forEach(s => {
    const d = s.direction || 'shared-context';
    if (!byDirection[d]) byDirection[d] = [];
    byDirection[d].push(s);
  });

  // Sort each direction by source_type (primary first) then strength
  const strengthOrder = { strong: 0, moderate: 1, weak: 2, '': 3 };
  const typeOrder = { primary: 0, secondary: 1, tertiary: 2, '': 3 };
  Object.values(byDirection).forEach(arr => {
    arr.sort((a, b) =>
      (typeOrder[a.source_type] ?? 9) - (typeOrder[b.source_type] ?? 9) ||
      (strengthOrder[a.strength] ?? 9) - (strengthOrder[b.strength] ?? 9)
    );
  });

  const column = (dirKey, label) => {
    const items = byDirection[dirKey] || [];
    return `
      <div class="evidence-column ${dirKey}">
        <h2>${label} (${items.length})</h2>
        ${items.length === 0
          ? '<p class="empty">None identified.</p>'
          : items.map(renderEvidenceCard).join('')}
      </div>
    `;
  };

  panel.innerHTML = `
    ${ev.summary ? `<div class="evidence-summary">
      <h2>Summary</h2>
      ${escapeHtml(ev.summary)}
    </div>` : ''}

    <div class="evidence-grid">
      ${column('supports', 'Supports')}
      ${column('disputes', 'Disputes')}
      ${column('redirects', 'Redirects')}
      ${column('shared-context', 'Shared Context')}
    </div>

    ${ev.search_notes ? `<details class="collapse">
      <summary>Search notes</summary>
      <div class="body normal-text">${escapeHtml(ev.search_notes)}</div>
    </details>` : ''}
  `;
}

function renderEvidenceCard(s) {
  const dir = s.direction || 'shared-context';
  const showStrength = dir === 'supports' || dir === 'disputes';
  const statusBadge = s.status && s.status !== 'current'
    ? `<div class="ev-status-warning">⚠ ${escapeHtml(s.status.replace(/-/g, ' '))}${s.status_notes ? ': ' + escapeHtml(s.status_notes) : ''}</div>`
    : '';
  return `
    <div class="evidence-card dir-${dir}">
      <div class="ev-title">${escapeHtml(s.title || '(untitled)')}</div>
      <div class="ev-badges">
        ${s.source_venue ? `<span class="ev-badge venue-${s.source_venue}">${escapeHtml(s.source_venue)}</span>` : ''}
        ${s.source_type ? `<span class="ev-badge type-${s.source_type}">${escapeHtml(s.source_type)}</span>` : ''}
        ${showStrength && s.strength ? `<span class="ev-badge strength-${s.strength}">${escapeHtml(s.strength)}</span>` : ''}
        ${s.date ? `<span class="ev-badge ev-date">${escapeHtml(s.date.slice(0, 10))}</span>` : ''}
      </div>
      ${statusBadge}
      ${s.description ? `<div class="ev-description">${escapeHtml(s.description)}</div>` : ''}
      ${s.notes ? `<div class="ev-notes">${escapeHtml(s.notes)}</div>` : ''}
      ${(verifyBadge(s) || archiveBadge(s)) ? `<div style="margin-bottom:0.4rem;">${verifyBadge(s)}${archiveBadge(s)}</div>` : ''}
      ${s.source_url ? `<div class="ev-link"><a href="${escapeHtml(s.source_url)}" target="_blank" rel="noopener">↗ ${escapeHtml(s.source_url)}</a></div>` : ''}
    </div>
  `;
}

function renderTaxonomic(fp) {
  const panel = document.querySelector('[data-panel=taxonomic]');
  const t = fp.taxonomic || {};
  panel.innerHTML = `
    <div class="card">
      <h2>Domain</h2>
      <span class="pill domain">${escapeHtml(t.domain || 'other')}</span>
      <span style="color:#777; font-size:0.85rem; margin-left:0.6rem;">confidence: ${t.domain_confidence ?? 0}</span>
    </div>
    <div class="card">
      <h2>Tropes</h2>
      ${(t.tropes || []).map(tp => `<span class="pill trope">${escapeHtml(tp)}</span>`).join('') || '<p class="empty">None invoked</p>'}
    </div>
    <div class="card">
      <h2>Inductive Cluster IDs</h2>
      ${(t.inductive_cluster_ids || []).length
        ? (t.inductive_cluster_ids || []).map(c => `<span class="pill">${escapeHtml(c)}</span>`).join('')
        : '<p class="empty">Not yet generated — cross-corpus clustering is a deferred feature.</p>'}
    </div>
  `;
}

</script>
</body>
