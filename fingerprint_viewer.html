<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tributary Fingerprint Viewer</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #fafaf7;
  color: #222;
  line-height: 1.5;
}

#drop-zone {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 2rem;
  border: 2px dashed #ccc;
  transition: background-color 0.2s;
}
#drop-zone.dragover { background: #f0eee5; border-color: #888; }
#drop-zone h1 { margin: 0 0 0.5rem; font-weight: 500; font-size: 2rem; }
#drop-zone p { color: #666; margin: 0 0 1.5rem; max-width: 560px; }
#drop-zone input[type=file] { display: none; }
#drop-zone label {
  cursor: pointer; padding: 0.6rem 1.4rem;
  background: #444; color: white; border-radius: 4px;
  font-size: 0.9rem;
}
#drop-zone label:hover { background: #222; }
#error { color: #b00; margin-top: 1rem; min-height: 1.4rem; }

header {
  background: white;
  padding: 1.5rem 2rem;
  border-bottom: 1px solid #eee;
}
header h1 { margin: 0 0 0.4rem; font-size: 1.5rem; font-weight: 500; }
#meta-bar { color: #777; font-size: 0.85rem; font-family: 'SF Mono', Menlo, monospace; }
#meta-bar span { margin-right: 1.2rem; }
#meta-bar strong { color: #555; font-weight: 500; }

#tabs {
  background: white;
  padding: 0 2rem;
  border-bottom: 1px solid #eee;
  display: flex;
  gap: 0;
  overflow-x: auto;
}
#tabs button {
  border: none;
  background: none;
  padding: 0.8rem 1.2rem;
  cursor: pointer;
  font-size: 0.9rem;
  color: #666;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
  white-space: nowrap;
}
#tabs button:hover { color: #222; }
#tabs button.active { color: #222; border-bottom-color: #444; font-weight: 500; }

main { padding: 2rem; max-width: 1200px; margin: 0 auto; }
section { animation: fadein 0.2s; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

.card {
  background: white;
  border: 1px solid #e5e5e5;
  border-radius: 6px;
  padding: 1.2rem;
  margin-bottom: 1rem;
}
.card h2 {
  margin: 0 0 0.6rem; font-size: 0.85rem;
  font-weight: 500; color: #555;
  text-transform: uppercase; letter-spacing: 0.06em;
}
.card p { margin: 0 0 0.6rem; }
.card .title-line { font-weight: 500; }

.pill {
  display: inline-block;
  padding: 0.2rem 0.7rem;
  margin: 0.15rem 0.3rem 0.15rem 0;
  background: #efece4;
  color: #333;
  border-radius: 999px;
  font-size: 0.85rem;
}
.pill.diagnostic { background: #f4ddc4; color: #6a3a06; font-weight: 500; }
.pill.frame { background: #d8e2ee; color: #2a4669; }
.pill.trope { background: #e6dcec; color: #4f2c5a; }
.pill.domain { background: #d4e3d5; color: #1e4427; font-size: 1rem; padding: 0.3rem 0.9rem; }

.summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 1rem;
}

.entity-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 0.6rem;
  margin-top: 0.4rem;
}
.entity-grid > div {
  padding: 0.6rem 0.9rem;
  background: #faf7ef;
  border-radius: 4px;
}
.entity-grid .label {
  font-size: 0.7rem; color: #888;
  text-transform: uppercase; letter-spacing: 0.05em;
  margin-bottom: 0.15rem;
}
.entity-grid .value { color: #222; }

.role-legend {
  display: flex; flex-wrap: wrap; gap: 1rem;
  margin-bottom: 1.4rem; padding: 0.7rem 1rem;
  background: white; border: 1px solid #e5e5e5; border-radius: 6px;
  font-size: 0.82rem;
}
.role-legend div { display: flex; align-items: center; gap: 0.4rem; }
.role-legend .dot { width: 0.7rem; height: 0.7rem; border-radius: 50%; }

.timeline-block { margin-bottom: 1.8rem; }
.timeline-block .timeline-header {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 0.4rem; flex-wrap: wrap;
}
.timeline-block h2 {
  margin: 0; font-size: 0.85rem; font-weight: 500;
  color: #555; text-transform: uppercase; letter-spacing: 0.06em;
}
.timeline-block .timeline-info { font-size: 0.82rem; color: #777; }
.timeline-svg {
  width: 100%; height: 90px;
  background: white; border: 1px solid #e5e5e5; border-radius: 6px;
}

.detail-card {
  background: white;
  border: 1px solid #e5e5e5;
  border-left: 4px solid #888;
  border-radius: 6px;
  padding: 1rem 1.2rem;
  margin: 1rem 0;
}
.detail-card.role-originator { border-left-color: #c0392b; }
.detail-card.role-early-amplifier { border-left-color: #d68f1a; }
.detail-card.role-mass-amplifier { border-left-color: #f0a500; }
.detail-card.role-institutional-adoption { border-left-color: #2a6fa3; }
.detail-card.role-critic { border-left-color: #6f3e8e; }
.detail-card.role-mention { border-left-color: #888; }
.detail-card .head {
  display: flex; justify-content: space-between; align-items: baseline;
  flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.4rem;
}
.detail-card .date {
  font-family: 'SF Mono', Menlo, monospace;
  color: #555; font-size: 0.9rem;
}
.detail-card .role-tag {
  font-size: 0.72rem; padding: 0.15rem 0.6rem;
  border-radius: 999px; background: #eee; color: #555;
  text-transform: uppercase; letter-spacing: 0.05em;
}
.detail-card .role-tag.originator { background: #fad7d1; color: #832018; }
.detail-card .role-tag.early-amplifier { background: #f7e0bb; color: #6a4308; }
.detail-card .role-tag.mass-amplifier { background: #fae7b8; color: #6a4d06; }
.detail-card .role-tag.institutional-adoption { background: #cfe0ee; color: #1b486f; }
.detail-card .role-tag.critic { background: #e2d2ec; color: #4a275a; }
.detail-card .role-tag.mention { background: #eaeaea; color: #444; }
.detail-card .role-tag.unknown { background: #eaeaea; color: #666; }
.detail-card .title-line { font-weight: 500; margin-bottom: 0.3rem; }
.detail-card .author { color: #666; font-size: 0.9rem; margin-bottom: 0.6rem; }
.detail-card .quote {
  padding: 0.6rem 0.9rem; background: #faf7ef;
  border-radius: 4px; font-style: italic; color: #333;
  margin-bottom: 0.6rem;
}
.detail-card .field { font-size: 0.85rem; color: #555; margin-top: 0.5rem; }
.detail-card .field .label {
  font-weight: 500; color: #444;
  text-transform: uppercase; font-size: 0.68rem;
  letter-spacing: 0.06em; display: block; margin-bottom: 0.15rem;
}
.detail-card a { color: #2a6fa3; text-decoration: none; word-break: break-all; }
.detail-card a:hover { text-decoration: underline; }

.collapse {
  background: white; border: 1px solid #e5e5e5;
  border-radius: 6px; margin-bottom: 1rem;
}
.collapse summary {
  padding: 0.7rem 1.2rem; cursor: pointer;
  font-weight: 500; font-size: 0.9rem; color: #444;
}
.collapse[open] summary { border-bottom: 1px solid #eee; }
.collapse .body {
  padding: 1rem 1.2rem; font-size: 0.85rem;
  color: #444; white-space: pre-wrap; line-height: 1.6;
}
.collapse .body.normal-text { white-space: normal; }

.mutation-card {
  background: #fafaf7;
  border: 1px solid #e5e5e5;
  border-radius: 5px;
  padding: 0.8rem 1rem;
  margin-bottom: 0.7rem;
}
.mutation-head {
  font-family: 'SF Mono', Menlo, monospace;
  font-size: 0.82rem;
  color: #555;
  margin-bottom: 0.6rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid #ececec;
}
.mutation-arrow {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  flex-wrap: wrap;
}
.mutation-arrow .arrow {
  color: #aaa;
  font-weight: bold;
}
.mutation-field {
  display: flex;
  gap: 0.7rem;
  margin: 0.35rem 0;
  font-size: 0.87rem;
  line-height: 1.55;
}
.mutation-label {
  flex-shrink: 0;
  width: 5.6rem;
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding-top: 0.15rem;
}
.mutation-field.preserved .mutation-label { color: #2e7d32; }
.mutation-field.dropped   .mutation-label { color: #757575; }
.mutation-field.added     .mutation-label { color: #1976d2; }
.mutation-field.distorted .mutation-label { color: #c45719; }
.mutation-field .mutation-text { color: #333; }

.timeline-stats-card { margin-bottom: 1.8rem; }
.timeline-stats-card h2 {
  margin: 0 0 0.7rem; font-size: 0.85rem; font-weight: 500;
  color: #555; text-transform: uppercase; letter-spacing: 0.06em;
}
.stats-chart {
  width: 100%; height: 110px;
  background: #fafaf7; border: 1px solid #ececec; border-radius: 4px;
  margin-top: 0.8rem;
}
.stats-chart text.tick { fill: #888; font-size: 10px; font-family: 'SF Mono', Menlo, monospace; }
.stats-chart rect:hover { opacity: 0.75; }

.social-card { margin-bottom: 1.8rem; }
.social-summary {
  display: flex; gap: 1.4rem; flex-wrap: wrap;
  margin-bottom: 0.8rem; font-size: 0.85rem; color: #555;
}
.social-summary strong { color: #222; }
.social-note {
  font-size: 0.82rem; color: #777;
  padding: 0.5rem 0.7rem; background: #faf7ef;
  border-radius: 4px; margin-bottom: 0.8rem;
}
.social-post {
  border: 1px solid #ececec;
  border-left: 3px solid #888;
  border-radius: 4px;
  padding: 0.7rem 0.9rem;
  margin-bottom: 0.5rem;
  font-size: 0.88rem;
}
.social-post.role-originator { border-left-color: #c0392b; }
.social-post.role-early-amplifier { border-left-color: #d68f1a; }
.social-post.role-mass-amplifier { border-left-color: #f0a500; }
.social-post.role-institutional-adoption { border-left-color: #2a6fa3; }
.social-post.role-critic { border-left-color: #6f3e8e; }
.social-post.role-mention { border-left-color: #888; }
.social-post .post-head {
  display: flex; gap: 0.6rem; align-items: baseline;
  margin-bottom: 0.3rem; flex-wrap: wrap;
}
.social-post .post-author { font-weight: 500; color: #2a6fa3; font-family: 'SF Mono', Menlo, monospace; font-size: 0.82rem; }
.social-post .post-date { color: #888; font-family: 'SF Mono', Menlo, monospace; font-size: 0.78rem; }
.social-post .post-engagement { color: #888; font-size: 0.78rem; margin-left: auto; }
.social-post .post-text { color: #333; line-height: 1.5; margin-bottom: 0.4rem; white-space: pre-wrap; word-break: break-word; }
.social-post .post-role { font-size: 0.75rem; color: #555; padding-top: 0.4rem; border-top: 1px solid #f0f0f0; }
.social-post .post-role .role-tag { padding: 0.1rem 0.5rem; border-radius: 999px; font-size: 0.72rem; }
.social-post .post-role .role-tag.originator { background: #fad7d1; color: #832018; }
.social-post .post-role .role-tag.early-amplifier { background: #f7e0bb; color: #6a4308; }
.social-post .post-role .role-tag.mass-amplifier { background: #fae7b8; color: #6a4d06; }
.social-post .post-role .role-tag.institutional-adoption { background: #cfe0ee; color: #1b486f; }
.social-post .post-role .role-tag.critic { background: #e2d2ec; color: #4a275a; }
.social-post .post-role .role-tag.mention { background: #eaeaea; color: #444; }
.social-post .post-role .role-tag.unknown { background: #eaeaea; color: #666; }
.social-post a { color: #2a6fa3; text-decoration: none; }
.social-post a:hover { text-decoration: underline; }

.evidence-summary {
  background: white; border: 1px solid #e5e5e5; border-radius: 6px;
  padding: 1rem 1.2rem; margin-bottom: 1.4rem;
  font-size: 0.95rem; line-height: 1.55; color: #333;
}
.evidence-summary h2 {
  margin: 0 0 0.5rem; font-size: 0.85rem; font-weight: 500;
  color: #555; text-transform: uppercase; letter-spacing: 0.06em;
}
.evidence-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
  gap: 1rem;
  margin-bottom: 1.4rem;
}
.evidence-column {
  background: white; border: 1px solid #e5e5e5; border-radius: 6px;
  padding: 1rem;
}
.evidence-column h2 {
  margin: 0 0 0.6rem; font-size: 0.82rem; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.06em;
  padding-bottom: 0.4rem; border-bottom: 1px solid #f0f0f0;
}
.evidence-column.supports h2 { color: #6a4d06; }
.evidence-column.disputes h2 { color: #1b486f; }
.evidence-column.redirects h2 { color: #4a275a; }
.evidence-column.shared-context h2 { color: #1e4427; }

.evidence-card {
  background: #fafaf7;
  border: 1px solid #ececec;
  border-left: 3px solid #888;
  border-radius: 4px;
  padding: 0.7rem 0.9rem;
  margin-bottom: 0.6rem;
  font-size: 0.88rem;
}
.evidence-card.dir-supports { border-left-color: #f0a500; }
.evidence-card.dir-disputes { border-left-color: #2a6fa3; }
.evidence-card.dir-redirects { border-left-color: #6f3e8e; }
.evidence-card.dir-shared-context { border-left-color: #2e7d32; }

.evidence-card .ev-title { font-weight: 500; margin-bottom: 0.35rem; color: #222; }
.evidence-card .ev-badges {
  display: flex; flex-wrap: wrap; gap: 0.3rem; margin-bottom: 0.45rem;
}
.evidence-card .ev-badge {
  font-size: 0.7rem; padding: 0.1rem 0.5rem;
  border-radius: 999px; background: #eee; color: #555;
}
.evidence-card .ev-badge.venue-peer-reviewed { background: #cfe0ee; color: #1b486f; }
.evidence-card .ev-badge.venue-institutional { background: #d4e3d5; color: #1e4427; }
.evidence-card .ev-badge.venue-news-outlet { background: #efece4; color: #4d3d18; }
.evidence-card .ev-badge.venue-opinion-venue { background: #e6dcec; color: #4f2c5a; }
.evidence-card .ev-badge.venue-aggregator { background: #eaeaea; color: #444; }
.evidence-card .ev-badge.venue-preprint-server { background: #d6e3ee; color: #1f3f5e; }
.evidence-card .ev-badge.venue-self-published { background: #f0e1ea; color: #4f2a44; }
.evidence-card .ev-badge.type-primary { background: #f7e0bb; color: #6a4308; font-weight: 600; }
.evidence-card .ev-badge.type-secondary { background: #eaeaea; color: #555; }
.evidence-card .ev-badge.type-tertiary { background: #f1eeea; color: #6a5a4a; }
.evidence-card .ev-badge.strength-strong { background: #d7e8d8; color: #1e4427; font-weight: 600; }
.evidence-card .ev-badge.strength-moderate { background: #ece8da; color: #4f4530; }
.evidence-card .ev-badge.strength-weak { background: #efe6da; color: #6a4d2b; }
.evidence-card .ev-badge.ev-date { background: #f5f5f0; color: #777; font-family: 'SF Mono', Menlo, monospace; }
.evidence-card .ev-status-warning {
  display: inline-block; padding: 0.15rem 0.55rem;
  background: #f7d7d2; color: #832018;
  border-radius: 999px; font-size: 0.72rem; font-weight: 600;
  margin-bottom: 0.4rem;
}
.evidence-card .ev-description { color: #333; margin-bottom: 0.35rem; line-height: 1.45; }
.evidence-card .ev-notes { font-size: 0.82rem; color: #666; margin-bottom: 0.4rem; font-style: italic; }
.evidence-card .ev-link a {
  color: #2a6fa3; text-decoration: none;
  font-size: 0.82rem; word-break: break-all;
}
.evidence-card .ev-link a:hover { text-decoration: underline; }

/* Verification badges — used on evidence cards, detail cards, and social posts */
.verify-badge {
  display: inline-block; padding: 0.1rem 0.5rem;
  border-radius: 999px; font-size: 0.72rem; font-weight: 500;
  margin-right: 0.3rem;
}
.verify-badge.verified            { background: #d4e8d6; color: #1e5128; }
.verify-badge.unchecked           { background: #eaeaea; color: #666; }
.verify-badge.url-error           { background: #fad7d1; color: #832018; }
.verify-badge.fetch-error         { background: #fad7d1; color: #832018; }
.verify-badge.quote-not-found     { background: #f9e5c0; color: #6a4308; }
.archive-link {
  display: inline-block; padding: 0.1rem 0.5rem;
  background: #e6dcec; color: #4f2c5a;
  border-radius: 999px; font-size: 0.72rem;
  margin-right: 0.3rem; text-decoration: none;
}
.archive-link:hover { text-decoration: underline; }

/* Provenance badges — AI vs human + review state. Quiet by default;
   human states light up once contributions populate. */
.prov-badge {
  display: inline-block; padding: 0.1rem 0.5rem;
  border-radius: 999px; font-size: 0.7rem; font-weight: 500;
  margin-right: 0.3rem; letter-spacing: 0.02em;
}
.prov-badge.prov-ai        { background: #f0eee9; color: #8a8275; }  /* muted: an AI assertion */
.prov-badge.prov-human     { background: #d8e2ee; color: #2a4669; }
.prov-badge.prov-confirmed { background: #d4e8d6; color: #1e5128; }
.prov-badge.prov-consensus { background: #b9ddbd; color: #14411c; font-weight: 600; }
.prov-badge.prov-disputed  { background: #f9e5c0; color: #6a4308; }
.prov-badge.prov-retracted { background: #fad7d1; color: #832018; }
#meta-bar .prov-badge { margin-left: 0.2rem; }

/* Downstream EventAnalysis view */
.event-intro { margin-bottom: 1.2rem; }
.event-intro .event-statement { font-size: 1.15rem; color: #222; line-height: 1.45; }
.event-intro p { color: #666; margin: 0.5rem 0 0; font-size: 0.88rem; }
.shared-foundation-card { margin-bottom: 1.6rem; border-left: 4px solid #2e7d32; }
.shared-foundation-card .sf-summary { color: #333; font-style: italic; margin-bottom: 0.9rem; }
.sf-section-label { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #555; margin: 0.7rem 0 0.35rem; }
.sf-fact { font-size: 0.9rem; color: #333; margin: 0.25rem 0; padding-left: 1rem; position: relative; }
.sf-fact::before { content: "•"; position: absolute; left: 0; color: #2e7d32; }
.sf-fact.unverified::before { color: #aaa; }
.sf-fact .sf-verified-tag { font-size: 0.68rem; color: #1e5128; margin-left: 0.4rem; }
.sf-disagreement { font-size: 0.9rem; color: #6a4308; margin: 0.25rem 0; padding-left: 1rem; position: relative; }
.sf-disagreement::before { content: "⇄"; position: absolute; left: 0; color: #d68f1a; }
.framings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1rem; margin-bottom: 1.4rem; }
.framing-card { background: white; border: 1px solid #e5e5e5; border-radius: 6px; padding: 1rem 1.1rem; }
.framing-card .fr-name { font-size: 1.05rem; font-weight: 600; color: #222; }
.framing-card .fr-question { color: #4f2c5a; font-size: 0.9rem; margin: 0.2rem 0 0.6rem; font-style: italic; }
.framing-card .fr-claim { color: #333; margin-bottom: 0.6rem; line-height: 1.45; }
.framing-card .fr-tone { display: inline-block; font-size: 0.68rem; padding: 0.1rem 0.5rem; border-radius: 999px; background: #efece4; color: #6a5a45; margin-bottom: 0.6rem; }
.fr-emph { font-size: 0.84rem; margin: 0.2rem 0; }
.fr-emph .lbl { font-weight: 600; color: #555; }
.fr-emph.up .lbl { color: #1e5128; }
.fr-emph.down .lbl { color: #832018; }
.fr-section { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #888; margin: 0.7rem 0 0.3rem; }
.fr-carrier { font-size: 0.84rem; margin: 0.3rem 0; padding-bottom: 0.3rem; border-bottom: 1px solid #f3f3f3; }
.fr-carrier .carrier-role { font-size: 0.66rem; padding: 0.05rem 0.45rem; border-radius: 999px; margin-right: 0.35rem; }
.fr-carrier .carrier-role.originator { background: #fad7d1; color: #832018; }
.fr-carrier .carrier-role.early-amplifier { background: #f7e0bb; color: #6a4308; }
.fr-carrier .carrier-role.mass-amplifier { background: #fae7b8; color: #6a4d06; }
.fr-carrier .carrier-role.institutional-adoption { background: #cfe0ee; color: #1b486f; }
.fr-carrier .carrier-role.critic { background: #e2d2ec; color: #4a275a; }
.fr-carrier .carrier-role.mention { background: #eaeaea; color: #444; }
.fr-carrier .carrier-role.unknown { background: #eaeaea; color: #666; }
.fr-carrier a { color: #2a6fa3; text-decoration: none; }
.fr-carrier a:hover { text-decoration: underline; }
.fr-carrier .carrier-excerpt { color: #666; }
.fr-omission { font-size: 0.82rem; color: #6a4308; margin: 0.25rem 0; }
.fr-omission .found-in { color: #888; }
.fr-trace { margin-top: 0.7rem; }
.fr-trace.clickable { cursor: pointer; color: #2a6fa3; font-weight: 500; font-size: 0.85rem; }
.fr-trace.clickable:hover { text-decoration: underline; }

/* Coverage lean (AllSides cross-reference) */
.coverage-card { margin-bottom: 1.6rem; border-left: 4px solid #5b6b7a; }
.cov-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 0.4rem; }

.cov-bar { display: flex; height: 26px; border-radius: 4px; overflow: hidden; margin: 0.7rem 0 0.3rem; background: #eee; }

/* Agenda report — selection & prominence across outlets (Phase 2) */

.lean-chip.left { background: #2c5fa8; } .lean-chip.lean-left { background: #6b95cf; }

/* Framing-attention matrix (Phase 2.6): outlets × an event's own framings */
.fa-table { border-collapse: collapse; width: 100%; font-size: 0.8rem; }

/* Coalition — who amplifies which framing (the headline of the event view) */
.coalition-card { margin-bottom: 1.6rem; border-left: 4px solid #5a4b8a; }

.coal-fchip { font-size: 0.72rem; padding: 0.1rem 0.5rem; border-radius: 10px; background: #efeaf6; color: #4a3d6b; border: 1px solid #ddd3ee; }
.coal-empty { color: #777; font-size: 0.85rem; font-style: italic; }

.atype { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.04em; padding: 0.1rem 0.4rem; border-radius: 3px; color: #fff; white-space: nowrap; }
.atype-news { background: #3a6ea5; } .atype-official { background: #9a6a2e; }
.atype-organization { background: #4a8a6a; } .atype-social { background: #7a5a9a; }
.atype-academic { background: #6a6a6a; } .atype-person { background: #b5773a; }
.atype-blog { background: #a05a5a; } .atype-reference { background: #bbb; } .atype-other { background: #999; }
.carrier-bridge { font-size: 0.66rem; color: #5a4b8a; background: #efeaf6; border: 1px solid #ddd3ee; border-radius: 8px; padding: 0.04rem 0.4rem; margin-left: 0.3rem; white-space: nowrap; }
.fr-carrier.is-bridge > a { font-weight: 600; }
.carrier-oppose { font-size: 0.66rem; color: #9a3b2e; background: #f6e9e7; border: 1px solid #eed3ce; border-radius: 8px; padding: 0.04rem 0.4rem; margin-left: 0.3rem; white-space: nowrap; }
.carrier-refhost { font-size: 0.66rem; color: #8a6d1a; background: #f8f3e2; border: 1px solid #eadfb8; border-radius: 8px; padding: 0.04rem 0.4rem; margin-left: 0.3rem; white-space: nowrap; }
.coal-section { font-size: 0.78rem; font-weight: 600; color: #444; margin: 1rem 0 0.4rem; padding-top: 0.7rem; border-top: 1px solid #eee; }
.coal-fchip.champ { background: #e7f1ea; color: #2c5f43; border-color: #cfe3d6; }
.coal-fchip.oppose { background: #f6e9e7; color: #8a3326; border-color: #eed3ce; }
details.cov-backdrop { margin: 1.4rem 0; border: 1px solid #e5e5e5; border-radius: 6px; background: #fafafa; }
details.cov-backdrop > summary { cursor: pointer; padding: 0.6rem 0.9rem; font-size: 0.82rem; color: #667; user-select: none; }
details.cov-backdrop[open] > summary { border-bottom: 1px solid #eee; }
details.cov-backdrop .coverage-card { margin: 0.8rem; border-left-width: 4px; }

/* Multi-claim source-analysis view */
.article-intro { margin-bottom: 1.2rem; }
.article-intro a { color: #2a6fa3; text-decoration: none; word-break: break-all; }
.article-intro p { color: #666; margin: 0.5rem 0 0; }
.claim-card.clickable { cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; }
.claim-card.clickable:hover { border-color: #888; box-shadow: 0 1px 8px rgba(0,0,0,0.08); }
.claim-card-head { display: flex; gap: 0.6rem; align-items: center; margin-bottom: 0.5rem; }
.claim-type-badge {
  font-size: 0.72rem; padding: 0.1rem 0.55rem; border-radius: 999px;
  text-transform: uppercase; letter-spacing: 0.05em;
}
.claim-type-badge.type-fact { background: #cfe0ee; color: #1b486f; }
.claim-type-badge.type-study { background: #d4e3d5; color: #1e4427; }
.claim-type-badge.type-narrative { background: #e6dcec; color: #4f2c5a; }
.claim-type-badge.type-opinion { background: #f7e0bb; color: #6a4308; }
.claim-type-badge.type-unverifiable { background: #eaeaea; color: #555; }
.claim-context { color: #888; font-size: 0.82rem; }

/* Content breakdown profile (article view) */
.breakdown-card { margin-bottom: 1.4rem; }
.breakdown-char { color: #444; font-style: italic; margin: 0 0 0.9rem; }
.breakdown-row {
  display: flex; align-items: center; gap: 0.7rem;
  margin-bottom: 0.4rem; font-size: 0.85rem;
}

  width: 6.5rem; flex-shrink: 0; text-transform: capitalize; color: #555;
}

  flex: 1; height: 0.8rem; background: #efece4;
  border-radius: 999px; overflow: hidden;
}

.breakdown-fill.type-fact { background: #2a6fa3; }
.breakdown-fill.type-study { background: #2e7d32; }
.breakdown-fill.type-narrative { background: #6f3e8e; }
.breakdown-fill.type-opinion { background: #d68f1a; }
.breakdown-fill.type-unverifiable { background: #aaa; }
.breakdown-pct {
  width: 6rem; flex-shrink: 0; text-align: right;
  color: #777; font-family: 'SF Mono', Menlo, monospace; font-size: 0.8rem;
}
.claim-text { font-size: 1.05rem; color: #222; margin-bottom: 0.4rem; line-height: 1.5; }
.claim-significance { color: #666; font-size: 0.88rem; margin-bottom: 0.5rem; }
.claim-cta { color: #2a6fa3; font-size: 0.85rem; font-weight: 500; }
.claim-cta.empty { color: #aaa; font-weight: normal; }
#back-to-article {
  margin: 0 0 0.9rem; padding: 0.4rem 0.9rem;
  background: #444; color: white; border: none;
  border-radius: 4px; cursor: pointer; font-size: 0.85rem;
}
#back-to-article:hover { background: #222; }

.empty { color: #999; font-style: italic; margin: 0; }
code { font-family: 'SF Mono', Menlo, monospace; background: #f1ede2; padding: 0.15rem 0.4rem; border-radius: 3px; }

circle.instance { cursor: pointer; transition: opacity 0.1s; }
circle.instance:hover { opacity: 0.7; }
.tick { fill: #aaa; font-size: 10px; font-family: 'SF Mono', Menlo, monospace; }
.lineage-line { stroke: #ddd; stroke-width: 1; }
</style>
</head>
<body>

<div id="drop-zone">
  <h1>Tributary Fingerprint Viewer</h1>
  <p>Drag a fingerprint JSON file here, or click to browse. Self-contained — runs entirely in your browser, no data leaves your machine.</p>
  <label for="file-input">Browse...</label>
  <input type="file" id="file-input" accept="application/json,.json">
  <div id="error"></div>
</div>

<div id="viewer" hidden>
  <header>
    <h1 id="claim-phrase"></h1>
    <div id="meta-bar"></div>
  </header>

  <nav id="tabs">
    <button data-tab="overview" class="active">Overview</button>
    <button data-tab="lexical">L1 Lexical</button>
    <button data-tab="conceptual">L2 Conceptual</button>
    <button data-tab="rhetorical">L3 Rhetorical</button>
    <button data-tab="lineages">L4 Lineages</button>
    <button data-tab="evidence">Evidence</button>
    <button data-tab="taxonomic">L5 Taxonomic</button>
  </nav>

  <main>
    <section data-panel="overview"></section>
    <section data-panel="lexical" hidden></section>
    <section data-panel="conceptual" hidden></section>
    <section data-panel="rhetorical" hidden></section>
    <section data-panel="lineages" hidden></section>
    <section data-panel="evidence" hidden></section>
    <section data-panel="taxonomic" hidden></section>
  </main>
</div>

<script>
const ROLE_COLORS = {
  'originator':              '#c0392b',
  'early-amplifier':         '#d68f1a',
  'mass-amplifier':          '#f0a500',
  'institutional-adoption':  '#2a6fa3',
  'critic':                  '#6f3e8e',
  'mention':                 '#888',
  'unknown':                 '#bbb',
};
const ROLE_ORDER = ['originator','early-amplifier','mass-amplifier','institutional-adoption','critic','mention','unknown'];

let currentFP = null;
let currentArticle = null;   // set when viewing a multi-claim source analysis
let currentEvent = null;     // set when viewing a downstream event analysis

const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const errorDiv = document.getElementById('error');
const viewer = document.getElementById('viewer');

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => { if (e.target.files.length) loadFile(e.target.files[0]); });

// Reference/aggregator hosts: a carrier link to one of these is a page ABOUT
// the event, not the named carrier's own words — flagged for transparency.
const REFERENCE_HOSTS = ['wikipedia.org', 'britannica.com', 'wikiwand.com', 'wikidata.org', 'wikimedia.org'];
function refHostName(url) {
  try {
    const h = new URL(url).hostname.toLowerCase();
    const hit = REFERENCE_HOSTS.find(r => h === r || h.endsWith('.' + r));
    return hit ? hit.split('.')[0].charAt(0).toUpperCase() + hit.split('.')[0].slice(1) : '';
  } catch (e) { return ''; }
}
function isReferenceHost(url) { return !!(url && refHostName(url)); }

function routeData(data) {
  if (data.is_framing_attention) {
    renderFramingAttention(data);
  } else if (data.is_agenda_report) {
    renderAgendaReport(data);
  } else if (data.is_event_analysis) {
    renderEventAnalysis(data);
  } else if (data.is_source_analysis) {
    renderArticle(data);
  } else if (data.fingerprint_id && data.lexical) {
    currentArticle = null;
    currentEvent = null;
    removeBackButton();
    document.getElementById('tabs').style.display = '';
    render(data);
  } else {
    throw new Error('Not a recognizable fingerprint, source-analysis, or event-analysis JSON');
  }
}

function loadFile(file) {
  errorDiv.textContent = '';
  const reader = new FileReader();
  reader.onload = () => {
    try {
      routeData(JSON.parse(reader.result));
    } catch (e) {
      errorDiv.textContent = 'Failed to load: ' + e.message;
    }
  };
  reader.onerror = () => { errorDiv.textContent = 'File read error.'; };
  reader.readAsText(file);
}

// Permalink support: fingerprint_viewer.html?load=<url> fetches a JSON and
// renders it directly — this is what makes every example/gallery trace a
// stable, shareable link. Relative paths resolve against this page (always
// same-origin); absolute URLs need CORS on their host. Under file:// the
// fetch can't work, so we say so instead of failing silently.
const loadParam = new URLSearchParams(location.search).get('load');
if (loadParam) {
  errorDiv.textContent = 'Loading …';
  fetch(loadParam)
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(data => { errorDiv.textContent = ''; routeData(data); })
    .catch(e => {
      errorDiv.textContent = `Failed to load "${loadParam}": ${e.message}` +
        (location.protocol === 'file:'
          ? ' — ?load= needs the page served over HTTP; for local files, drag the JSON onto this page instead.'
          : '');
    });
}

function removeBackButton() {
  const b = document.getElementById('back-to-article');
  if (b) b.remove();
}

function renderEventAnalysis(analysis) {
  currentEvent = analysis;
  currentArticle = null;
  dropZone.hidden = true;
  viewer.hidden = false;
  removeBackButton();

  document.getElementById('claim-phrase').textContent = analysis.event || '(event analysis)';

  const meta = document.getElementById('meta-bar');
  meta.innerHTML = '';
  addMeta(meta, 'event analysis', analysis.analysis_id || '');
  if (analysis.event_date) addMeta(meta, 'event date', (analysis.event_date || '').split('T')[0]);
  addMeta(meta, 'framings', String((analysis.framings || []).length));
  if (analysis.provenance) {
    const span = document.createElement('span');
    span.innerHTML = `<strong>analysis:</strong> ${provenanceBadge(analysis)}`;
    meta.appendChild(span);
  }

  document.getElementById('tabs').style.display = 'none';

  const fpById = {};
  (analysis.fingerprints || []).forEach(f => { fpById[f.fingerprint_id] = f; });

  // Coalition: map each bridging actor's display name -> how many framings it
  // spans, so we can badge cross-cutting carriers inside the framing cards.
  const co = analysis.coalition || {};
  const bridgeByName = {};
  (co.bridges || []).forEach(b => { bridgeByName[b.display] = b.n_framings; });

  const sf = analysis.shared_foundation || {};
  const verified = sf.verified_facts || [];
  const unverified = sf.unverified_shared_claims || [];
  const disagreements = sf.points_of_disagreement || [];

  const sharedHtml = `
    <div class="card shared-foundation-card">
      <h2>Common Ground</h2>
      ${sf.summary ? `<div class="sf-summary">${escapeHtml(sf.summary)}</div>` : ''}
      ${verified.length ? `<div class="sf-section-label">Verified shared facts</div>
        ${verified.map(f => `<div class="sf-fact">${escapeHtml(f.statement || '')}${f.verified ? '<span class="sf-verified-tag">✓ verifiable</span>' : ''}</div>`).join('')}` : ''}
      ${unverified.length ? `<div class="sf-section-label">Shared but unverified</div>
        ${unverified.map(f => `<div class="sf-fact unverified">${escapeHtml(f.statement || '')}</div>`).join('')}` : ''}
      ${disagreements.length ? `<div class="sf-section-label">Points of disagreement</div>
        ${disagreements.map(p => `<div class="sf-disagreement">${escapeHtml(p)}</div>`).join('')}` : ''}
    </div>`;

  const framingsHtml = (analysis.framings || []).map((fr, idx) => {
    const hasFp = !!fpById[fr.fingerprint_id];
    const carriers = (fr.carriers || []).map(c => {
      const role = c.amplifier_role || 'unknown';
      const bn = Object.keys(bridgeByName).find(b => b && (c.name || '').includes(b));
      const bridgeBadge = bn ? `<span class="carrier-bridge" title="this actor champions ${bridgeByName[bn]} different framings of this event">⇄ ${bridgeByName[bn]} framings</span>` : '';
      const opposeBadge = role === 'critic' ? `<span class="carrier-oppose" title="pushes back on / rebuts this framing rather than carrying it">⊘ opposes</span>` : '';
      // Transparency: a link to an encyclopedia/aggregator page is NOT the
      // named carrier's own words — say so instead of letting the label imply it.
      const refBadge = isReferenceHost(c.url)
        ? `<span class="carrier-refhost" title="this link goes to a reference/aggregator page about the event, not to the named carrier's own statement">via ${escapeHtml(refHostName(c.url))}</span>` : '';
      return `<div class="fr-carrier${bn ? ' is-bridge' : ''}${role === 'critic' ? ' is-oppose' : ''}">
        <span class="carrier-role ${role}">${escapeHtml(role)}</span>
        ${c.url ? `<a href="${escapeHtml(c.url)}" target="_blank" rel="noopener">${escapeHtml(c.name || c.url)}</a>` : `<span>${escapeHtml(c.name || '')}</span>`}
        ${refBadge}${opposeBadge}${bridgeBadge}
        ${c.excerpt ? `<span class="carrier-excerpt"> — ${escapeHtml(c.excerpt)}</span>` : ''}
        ${provenanceBadge(c)}${verifyBadge(c)}${archiveBadge(c)}
      </div>`;
    }).join('');
    const omissions = (fr.omissions || []).map(o =>
      `<div class="fr-omission">${escapeHtml(o.what_is_missing || '')} <span class="found-in">(in: ${escapeHtml(o.found_in_framing || '?')})</span></div>`
    ).join('');
    let trace;
    if (hasFp) trace = `<div class="fr-trace clickable" data-framing-idx="${idx}">↗ Trace this framing's origin →</div>`;
    else if (fr.fingerprint_id) trace = `<div class="fr-trace untraced">(linked fingerprint ${escapeHtml(fr.fingerprint_id)} not embedded)</div>`;
    else trace = `<div class="fr-trace untraced">(not yet traced — run with --trace-framings)</div>`;
    return `
      <div class="framing-card">
        <div class="fr-name">${escapeHtml(fr.name || '')} ${provenanceBadge(fr)}</div>
        ${fr.question ? `<div class="fr-question">${escapeHtml(fr.question)}</div>` : ''}
        ${fr.key_claim ? `<div class="fr-claim">${escapeHtml(fr.key_claim)}</div>` : ''}
        ${fr.tone ? `<span class="fr-tone">${escapeHtml(fr.tone)}</span>` : ''}
        ${fr.emphasizes ? `<div class="fr-emph up"><span class="lbl">Emphasizes:</span> ${escapeHtml(fr.emphasizes)}</div>` : ''}
        ${fr.downplays ? `<div class="fr-emph down"><span class="lbl">Downplays:</span> ${escapeHtml(fr.downplays)}</div>` : ''}
        ${(fr.sample_headlines || []).length ? `<div class="fr-section">Sample headlines</div>${fr.sample_headlines.map(h => `<div class="fr-omission" style="color:#555;">“${escapeHtml(h)}”</div>`).join('')}` : ''}
        ${carriers ? `<div class="fr-section">Carriers (who creates / amplifies)</div>${carriers}` : ''}
        ${omissions ? `<div class="fr-section">Leaves out</div>${omissions}` : ''}
        ${trace}
      </div>`;
  }).join('');

  const main = document.querySelector('main');
  main.innerHTML = `
    <div class="event-intro">
      <div class="event-statement">${escapeHtml(analysis.event || '')}</div>
      <p>${(analysis.framings || []).length} narrative framings mapped across the ecosystem. The shared common ground is what all sides accept; each framing asks a different question.</p>
    </div>
    ${sharedHtml}
    ${renderCoalition(co)}
    <h2 style="font-size:0.85rem; font-weight:500; color:#555; text-transform:uppercase; letter-spacing:0.06em; margin:0 0 0.7rem;">Competing Framings</h2>
    <div class="framings-grid">${framingsHtml || '<p class="empty">No framings identified.</p>'}</div>
    ${renderCoverageBackdrop(analysis.coverage_lean)}
    ${analysis.gap_analysis ? `<div class="card event-gap-card"><h2>What May Be Missing</h2><p style="color:#444;">${escapeHtml(analysis.gap_analysis)}</p></div>` : ''}
  `;

  main.querySelectorAll('.fr-trace.clickable').forEach(el => {
    el.onclick = () => {
      const fr = analysis.framings[parseInt(el.dataset.framingIdx, 10)];
      const fp = fpById[fr.fingerprint_id];
      if (fp) openFingerprintFromEvent(fp);
    };
  });
}

function renderCoverageLean(cl) {
  if (!cl || !cl.distribution) return '';
  const order = ['left', 'lean-left', 'center', 'lean-right', 'right'];
  const labels = { 'left': 'L', 'lean-left': 'LL', 'center': 'C', 'lean-right': 'LR', 'right': 'R' };
  const dist = cl.distribution || {};
  const n = cl.rated_outlets || 0;
  const skew = cl.skew || '';
  let skewClass = '';
  if (skew.startsWith('insufficient')) skewClass = 'insufficient';
  else if (skew.startsWith('no rated')) skewClass = 'none';
  else if (skew.startsWith('one-sided')) skewClass = 'onesided';

  // Stacked bar (only when we actually have rated outlets)
  let bar = '';
  if (n > 0) {
    const segs = order.map(b => {
      const c = dist[b] || 0;
      if (!c) return '';
      const w = (100 * c / n).toFixed(1);
      return `<div class="cov-seg ${b}" style="flex:0 0 ${w}%" title="${b}: ${c}">${c}</div>`;
    }).join('');
    bar = `<div class="cov-bar">${segs}</div>
      <div class="cov-scale"><span>← left</span><span>center</span><span>right →</span></div>`;
  }

  // Matched-outlet chips, left → right
  const chips = (cl.matched || []).map(m =>
    `<span class="cov-chip"><span class="dot cov-seg ${m.bucket}"></span>${escapeHtml(m.carrier || m.outlet || '')}</span>`
  ).join('');

  const gap = cl.coverage_gap || {};
  const gapNote = gap.unrated_news_carriers
    ? `<div class="cov-note">${gap.unrated_news_carriers} news ${gap.unrated_news_carriers === 1 ? 'carrier' : 'carriers'} not in the bias DB (coverage gap, not counted): ${
        (gap.examples || []).map(g => escapeHtml(g.domain || g.carrier || '')).filter(Boolean).join(', ')}</div>`
    : '';

  const eco = cl.ecosystem || {};
  const bt = eco.by_type || {};
  const ecoNote = eco.n_framings ? `<div class="cov-eco"><strong>Who's contesting it:</strong>
      news ${bt.news||0} · political ${bt.political||0} · institutional ${bt.institutional||0} · social ${bt.social||0}
      &nbsp;—&nbsp; ${eco.vested_interest||0} vested-interest carriers across ${eco.framings_with_vested||0}/${eco.n_framings} framings.
      <span class="cov-sub">(texture, not a polarization score — many stakeholders can mean a big event, not a charged one)</span></div>` : '';

  const idxNote = (cl.lean_index !== null && cl.lean_index !== undefined && n > 0)
    ? `lean index ${cl.lean_index} (−2 all-left … +2 all-right)` : '';

  return `
    <div class="card coverage-card">
      <div class="cov-head">
        <h2 style="margin:0;">Coverage Lean</h2>
        <span class="cov-sub">${n} of ${n + (gap.unrated_news_carriers || 0)} news outlets rated${
          cl.resolve_rate !== undefined ? ` · ${Math.round(cl.resolve_rate * 100)}% resolved` : ''}</span>
      </div>
      <div class="cov-skew ${skewClass}">${escapeHtml(skew)}${idxNote ? ` <span class="cov-sub" style="font-weight:400;">· ${idxNote}</span>` : ''}</div>
      ${bar}
      ${chips ? `<div class="cov-outlets">${chips}</div>` : ''}
      ${gapNote}
      ${ecoNote}
      <div class="cov-attrib">Outlet bias ratings: AllSides${cl.as_of ? ` (${escapeHtml(cl.as_of)})` : ''} — aggregated by Tributary, which adjudicates nothing. This is the lean of the carriers we surfaced, a sample, not a census.</div>
    </div>`;
}

function renderCoalition(co) {
  if (!co || !(co.framings || []).length) return '';
  const bridges = co.bridges || [];
  const aType = t => `atype-${(t || 'other')}`;
  const bridgesHtml = bridges.length
    ? bridges.slice(0, 14).map(b => `
        <div class="coal-bridge">
          <span class="atype ${aType(b.actor_type)}">${escapeHtml(b.actor_type || 'other')}</span>
          <span class="coal-actor">${escapeHtml(b.display || '')}</span>
          <span class="coal-arrow">carries</span>
          ${(b.framings || []).map(f => `<span class="coal-fchip">${escapeHtml(f)}</span>`).join('')}
        </div>`).join('')
    : `<p class="coal-empty">No actor carries more than one framing — each framing is carried by a largely separate set of actors (siloed coverage).</p>`;
  const more = bridges.length > 14
    ? `<div class="coal-more">+ ${bridges.length - 14} more bridging actors</div>` : '';
  const contested = co.contested_actors || [];
  const contestedHtml = contested.length ? `
    <div class="coal-section">Contested actors <span class="coal-sub">— champion one framing, oppose another (the genuine strange bedfellows)</span></div>
    ${contested.slice(0, 10).map(c => `
      <div class="coal-bridge">
        <span class="atype ${aType(c.actor_type)}">${escapeHtml(c.actor_type || 'other')}</span>
        <span class="coal-actor">${escapeHtml(c.display || '')}</span>
        ${(c.champions || []).map(f => `<span class="coal-fchip champ">+ ${escapeHtml(f)}</span>`).join('')}
        ${(c.opposes || []).map(f => `<span class="coal-fchip oppose">− ${escapeHtml(f)}</span>`).join('')}
      </div>`).join('')}` : '';
  const types = co.by_actor_type || {};
  const typeline = Object.entries(types).sort((a, b) => b[1] - a[1])
    .map(([t, n]) => `${n} ${t}`).join(' · ');
  return `
    <div class="card coalition-card">
      <div class="cov-head">
        <h2 style="margin:0;">Who's Amplifying What</h2>
        <span class="cov-sub">${co.n_actors || 0} actors across ${co.n_framings || 0} framings${typeline ? ' — ' + typeline : ''}</span>
      </div>
      <p class="coal-intro">Each framing is a different <em>question</em> being asked about this event. The actors below each carry <strong>more than one</strong> framing — the connectors that cut across the lenses (everyone else sits under a single framing). This maps <em>who amplifies which narrative</em>, not where a source sits on a left/right axis.</p>
      <div class="coal-bridges">${bridgesHtml}</div>
      ${more}
      ${contestedHtml}
    </div>`;
}

function renderCoverageBackdrop(cl) {
  if (!cl || !cl.distribution) return '';
  return `<details class="cov-backdrop">
    <summary>Left / right coverage lean — AllSides backdrop (experimental, US-centric)</summary>
    ${renderCoverageLean(cl)}
  </details>`;
}

function openFingerprintFromEvent(fp) {
  document.getElementById('tabs').style.display = '';
  render(fp);
  removeBackButton();
  const header = document.querySelector('header');
  const back = document.createElement('button');
  back.id = 'back-to-article';
  back.textContent = '← Back to event';
  back.onclick = () => { if (currentEvent) renderEventAnalysis(currentEvent); };
  header.insertBefore(back, header.firstChild);
}

// ---- Framing-attention matrix (Phase 2.6): outlets × event framings ------
// Divergence measured against the event's OWN framings — no L/R axis in the
// claim. Labels are AI-interpretive (judge provenance shown; Gate 2.6b badge
// stays until the human audit passes).

function renderFramingAttention(r) {
  currentEvent = null;
  currentArticle = null;
  dropZone.hidden = true;
  viewer.hidden = false;
  removeBackButton();
  document.getElementById('tabs').style.display = 'none';

  document.getElementById('claim-phrase').textContent =
    'Framing attention — ' + (r.event || '').slice(0, 120);
  const meta = document.getElementById('meta-bar');
  meta.innerHTML = '';
  addMeta(meta, 'event', r.event_id || '');
  addMeta(meta, 'window', `${r.window_days || '?'} day(s)`);
  addMeta(meta, 'headlines', String(r.n_candidate_headlines || 0));
  addMeta(meta, 'judge', `${(r.judge || {}).model || '?'} (${(r.judge || {}).prompt_version || ''})`);

  const allFramings = r.framings || [];
  const totals = r.framing_totals || {};
  const tCount = fid => { const t = totals[fid] || {}; return (t.expressed || 0) + (t.reported || 0) + (t.items || 0); };
  // Clarity: only framings somebody actually used get a column; the silent
  // ones are listed below the table (information preserved, eight columns
  // of dots avoided).
  const framings = allFramings.filter(f => tCount(f.id) > 0);
  const silent = allFramings.filter(f => !tCount(f.id));
  const fIds = framings.map(f => f.id);
  const fLabel = {};
  framings.forEach((f, i) => { fLabel[f.id] = 'F' + (i + 1); });

  const legend = framings.map((f, i) => {
    const t = totals[f.id] || {};
    const counts = t.expressed !== undefined
      ? `${t.expressed} expressed / ${t.reported} reported`
      : `${t.items || 0} headline(s)`;
    return `<div class="fa-legend"><span class="fa-fid">F${i + 1}</span>
      <strong>${escapeHtml(f.name)}</strong>
      <span style="color:#888;">— ${counts} across ${t.n_outlets || 0} outlet(s)</span>
      <div style="color:#555; margin-top:0.15rem;">${escapeHtml(f.key_claim)}</div></div>`;
  }).join('');

  const rows = Object.entries(r.matrix || {}).map(([okey, row]) => {
    const cells = fIds.map(fid => {
      const c = (row.framings || {})[fid];
      if (!c) return '<td><span class="fa-cell zero">·</span></td>';
      const led = c.best_position <= 5;
      const e = c.expressed !== undefined ? c.expressed : (c.items || 0);
      const rep = c.reported || 0;
      const txt = rep ? `${e || '·'}<span style="opacity:0.65; font-weight:400;">+${rep}</span>` : `${e}`;
      return `<td><span class="fa-cell${led ? ' featured' : ''}" title="expressed ${e}, reported ${rep}; best feed position ${c.best_position}${led ? ' — this outlet LED its feed with this framing' : ''}">${txt}</span></td>`;
    }).join('');
    const details = fIds.flatMap(fid => ((row.framings || {})[fid] || {}).headlines ? row.framings[fid].headlines.map(h =>
      `<div class="agenda-evidence">${fLabel[fid]}${h.relation === 'reports' ? ' <span style="color:#999;">(reports)</span>' : ''} (${escapeHtml(h.confidence)}) — ${h.link ? `<a href="${escapeHtml(h.link)}" target="_blank" rel="noopener">${escapeHtml(h.title)}</a>` : escapeHtml(h.title)} <span style="color:#aaa;">pos ${h.position}; ${escapeHtml(h.why || '')}</span></div>`) : []
    ).join('');
    return `<tr><td class="o-name">${escapeHtml(row.name)} ${leanChip(row.lean)}</td>
      ${cells}<td><span class="fa-cell zero">${row.none || 0}</span></td></tr>` +
      (details ? `<tr><td colspan="${fIds.length + 2}" style="text-align:left;"><details><summary style="cursor:pointer; color:#777; font-size:0.74rem;">headlines + judge reasons</summary>${details}</details></td></tr>` : '');
  }).join('');

  const main = document.querySelector('main');
  main.innerHTML = `
    <div class="event-intro">
      <div class="event-statement">Which framings does each outlet's front feed express?</div>
      <p>Headlines from the capture window aligned to this event's own framings — narrative-level selection,
      with no left/right axis in the claim. <span class="fa-audit">${escapeHtml((r.judge || {}).audit_status || 'audit status unknown')}</span></p>
    </div>
    <div class="card">
      <h2>The framings</h2>
      ${legend}
    </div>
    <div class="card">
      <h2>Outlet × framing matrix</h2>
      <p style="color:#777; font-size:0.8rem;">Counts of front-feed headlines per framing: <strong>bold = expressed</strong> (the headline takes the framing's perspective), <span style="opacity:0.65;">+n = reported</span> (neutrally covers that framing's subject matter). <span class="fa-cell featured" style="font-size:0.7rem;">dark</span> = the outlet <em>led its feed</em> with this framing (position ≤ 5) — featuring is a stronger editorial statement than carrying.</p>
      <div style="overflow-x:auto;"><table class="fa-table">
        <tr><th class="o-name">outlet</th>${fIds.map(fid => `<th title="${escapeHtml((framings.find(f => f.id === fid) || {}).name || '')}">${fLabel[fid]}</th>`).join('')}<th>none</th></tr>
        ${rows}
      </table></div>
      ${silent.length ? `<p style="color:#888; font-size:0.78rem; margin-top:0.6rem;">Framings no sampled front-feed headline expressed: ${silent.map(f => escapeHtml(f.name)).join(' · ')}</p>` : ''}
      <div class="agenda-caveat" style="margin-top:0.9rem;"><strong>Read this first:</strong> ${escapeHtml(r.method_caveat || '')}</div>
    </div>
  `;
}

// ---- Agenda report (Phase 2): selection & prominence across outlets ------
// Everything here is countable/structural (P5): which stories each outlet's
// sampled feeds carried, at what position, and what they showed no coverage
// of. No verdicts; omission language stays inside its method caveat.

function leanChip(bucket) {
  if (!bucket) return '<span class="lean-chip unrated">unrated</span>';
  const lbl = { 'left': 'L', 'lean-left': 'LL', 'center': 'C', 'lean-right': 'LR', 'right': 'R' }[bucket] || bucket;
  return `<span class="lean-chip ${escapeHtml(bucket)}" title="AllSides: ${escapeHtml(bucket)}">${lbl}</span>`;
}

function agendaMinibar(spread) {
  const order = ['left', 'lean-left', 'center', 'lean-right', 'right'];
  const total = order.reduce((a, b) => a + (spread[b] || 0), 0) +
    (spread.international || 0) + (spread.unrated || 0);
  if (!total) return '';
  const seg = (cls, n, title) => n ? `<div class="cov-seg ${cls}" style="flex:${n}" title="${title}: ${n}"></div>` : '';
  return `<div class="agenda-minibar" title="distinct outlets by AllSides lean (gray = international/unrated)">
    ${order.map(b => seg(b, spread[b] || 0, b)).join('')}
    ${seg('other', (spread.international || 0) + (spread.unrated || 0), 'international/unrated')}
  </div>`;
}

function renderAgendaReport(report) {
  currentEvent = null;
  currentArticle = null;
  dropZone.hidden = true;
  viewer.hidden = false;
  removeBackButton();
  document.getElementById('tabs').style.display = 'none';

  const period = report.period || {};
  const totals = report.totals || {};
  document.getElementById('claim-phrase').textContent =
    `Agenda report — last ${period.days || '?'} day${period.days === 1 ? '' : 's'} of feed captures`;
  const meta = document.getElementById('meta-bar');
  meta.innerHTML = '';
  addMeta(meta, 'generated', (report.generated_at || '').split('T')[0]);
  addMeta(meta, 'captures', String(totals.captures || 0));
  addMeta(meta, 'items', String(totals.unique_items || 0));
  addMeta(meta, 'stories', String(totals.stories || 0));

  const leans = (report.roster || {}).leans || {};

  // -- cross-outlet stories (top of the shared agenda) --
  const stories = (report.stories || []).filter(s => s.n_outlets >= 2).slice(0, 25);
  const storiesHtml = stories.map(s => {
    const carriers = (s.carriers || []).map(c =>
      `${escapeHtml(c.name)}${leanChip(leans[c.outlet])} ×${c.items} <span style="color:#999">(best pos ${c.best_position})</span>`
    ).join(' · ');
    return `<details class="agenda-story">
      <summary>
        <span class="agenda-count">${s.n_outlets} outlets</span>
        <span class="agenda-label">${escapeHtml(s.label || '')}</span>
        ${agendaMinibar(s.lean_spread || {})}
        ${s.one_side_only ? `<span class="agenda-badge oneside" title="among rated US outlets in this sample">${escapeHtml(s.one_side_only)}</span>` : ''}
        ${s.factcheck_attention ? `<span class="agenda-badge factcheck" title="selected for checking by ${s.factcheck_attention} fact-checker(s) — their selection, never their verdict">fact-checked ×${s.factcheck_attention}</span>` : ''}
      </summary>
      <div class="agenda-carriers">${carriers}</div>
      ${s.nearest_trace ? `<div class="agenda-evidence">↗ near an already-traced narrative: “${escapeHtml(s.nearest_trace.canonical_phrase)}” (phrasing ${s.nearest_trace.l1_sim} / idea ${s.nearest_trace.l2_sim} — embedding-stage lead, unconfirmed)</div>` : ''}
    </details>`;
  }).join('');

  // -- per-outlet attention (the outlet's agenda fingerprint) --
  // Volume from the sitemap census where one exists; feed position is the
  // separate prominence signal. Feed-only outlets are labeled as such.
  // Tolerates both report generations (schema convention: old JSON must
  // always render): v1 rows used items/best_position; v2 uses feed_items/
  // best_feed_position + the sitemap census fields.
  const att = report.attention || {};
  const attCards = Object.entries(att)
    .filter(([, a]) => a.stream === 'news' &&
      ((a.sitemap_articles || 0) > 0 || (a.feed_items ?? a.items ?? 0) > 0))
    .sort((a, b) => (b[1].sitemap_articles || b[1].feed_items || b[1].items || 0) -
                    (a[1].sitemap_articles || a[1].feed_items || a[1].items || 0))
    .map(([key, a]) => {
      const sitemapBased = (a.sitemap_articles || 0) > 0;
      const feedItems = a.feed_items ?? a.items ?? 0;
      const top = (a.top || []).slice(0, 3).map(t => {
        const nFeed = t.feed_items ?? t.items ?? 0;
        const n = sitemapBased ? `${t.articles} article${t.articles === 1 ? '' : 's'}` : `${nFeed} feed item${nFeed === 1 ? '' : 's'}`;
        const bp = t.best_feed_position ?? t.best_position;
        const pos = bp ? ` · feed pos ${bp}` : (sitemapBased ? ' · not feed-featured' : '');
        return `<div>${(100 * t.share).toFixed(1)}% (${n}${pos}) — ${escapeHtml(t.label)}</div>`;
      }).join('');
      const featured = (a.featured || []).slice(0, 3).map(f =>
        `<div>pos ${f.best_feed_position}${f.captures_seen > 1 ? ` across ${f.captures_seen} captures` : ''} — ${escapeHtml(f.label)}</div>`
      ).join('');
      const base = sitemapBased
        ? `${a.sitemap_articles} articles (sitemap census) · ${feedItems} feed items`
        : `${feedItems} feed items · <em>${escapeHtml(a.basis || 'front-feed sample')}</em>`;
      return `<div class="agenda-att">
        <div class="o-name">${escapeHtml(a.name)} ${leanChip(leans[key])}</div>
        <div style="color:#777; font-size:0.74rem;">${base}</div>
        <div class="o-top">${top || '<em>no stories matched</em>'}</div>
        ${featured ? `<div class="o-top" style="border-top:1px dashed #e7e7e7; margin-top:0.35rem; padding-top:0.3rem;"><strong style="color:#5a4b8a;">Led their feed:</strong>${featured}</div>` : ''}
      </div>`;
    }).join('');

  // -- omission report (guarded; the caveat is part of the output;
  //    existence comes from news-sitemaps, never RSS — Gate 2 pre-log) --
  const om = report.omissions || {};
  const omRows = (om.by_outlet || []).filter(r => !r.insufficient_sample && (r.missed || (r.adjacent_stories || []).length || (r.covered_not_featured || []).length)).map(r => {
    const missed = (r.missed_stories || []).map(m =>
      `<div class="agenda-evidence">∅ <strong>${escapeHtml(m.label)}</strong> (carried by ${m.n_outlets} outlets) — nearest of ${r.sitemap_articles} sitemap articles: “${escapeHtml(m.nearest_article || '(none)')}” at similarity ${m.nearest_sim}</div>`
    ).join('');
    const adjacent = (r.adjacent_stories || []).map(a =>
      `<div class="agenda-evidence">≈ adjacent to <strong>${escapeHtml(a.label)}</strong> via “${escapeHtml(a.nearest_article)}” (${a.nearest_sim})</div>`
    ).join('');
    const covered = (r.covered_not_featured || []).map(c =>
      `<div class="agenda-evidence">✓ covered, not feed-featured: <strong>${escapeHtml(c.label)}</strong> — ${c.nearest_url ? `<a href="${escapeHtml(c.nearest_url)}" target="_blank" rel="noopener">${escapeHtml(c.nearest_article)}</a>` : escapeHtml(c.nearest_article)} (${c.nearest_sim}); a prominence observation, not an omission</div>`
    ).join('');
    return `<details class="agenda-omit-row">
      <summary>${escapeHtml(r.name)} ${leanChip(r.lean)} — <strong>${r.missed}</strong> of ${r.broad_stories} broad stories with no sitemap match
        <span style="color:#999;">(${r.sitemap_articles} sitemap articles in window)</span></summary>
      ${missed}${adjacent}${covered}
    </details>`;
  }).join('');
  const omSkipped = (om.by_outlet || []).filter(r => r.insufficient_sample).map(r =>
    `${escapeHtml(r.name)} (${r.sitemap_articles} articles)`).join(', ');
  const omNoSitemap = (om.no_sitemap_no_claims || []).map(escapeHtml).join(', ');
  const oneSide = (om.one_side_only || []).map(s =>
    `<div class="agenda-omit-row">“${escapeHtml(s.label)}” — <span class="agenda-badge oneside">${escapeHtml(s.side_present)}</span> (${s.n_outlets} outlets carried it)</div>`
  ).join('');

  // -- universe cross-check --
  const u = report.universe || {};
  const uncovered = (u.uncovered_by_roster || []).map(e =>
    `<div class="agenda-evidence">• ${escapeHtml(e.event)} <span style="color:#aaa">(best story similarity ${e.best_sim})</span></div>`
  ).join('');

  const main = document.querySelector('main');
  main.innerHTML = `
    <div class="event-intro">
      <div class="event-statement">What did each outlet's front feed carry — and what didn't it?</div>
      <p>Selection and prominence, counted from ${totals.captures || 0} raw RSS capture(s) across the roster.
      Every number below is structural: which stories appeared in which outlet's sampled feeds, at what position.
      No story content is judged, and lean labels are AllSides', not ours.</p>
    </div>

    <div class="card">
      <h2>Outlet attention distributions</h2>
      <p style="color:#777; font-size:0.8rem;">The share of each outlet's output (sitemap census of ~72h where available) devoted to each cross-outlet story — its agenda fingerprint — and what it <strong>led its feed</strong> with. "Feed pos" is the prominence signal: where the story sat in the outlet's front feed.</p>
      <div class="agenda-att-grid">${attCards}</div>
    </div>

    <div class="card">
      <h2>Shared stories across outlets</h2>
      <p style="color:#777; font-size:0.8rem;">Headlines grouped by the local matcher (threshold ${totals.story_threshold}); each story expands to its carriers. The bar shows which leans carried it.</p>

    </div>

    ${u.events ? `<div class="card">
      <h2>Event universe cross-check <span style="font-weight:400; color:#999; font-size:0.75rem;">experimental</span></h2>
      <p style="color:#777; font-size:0.8rem;">Wikipedia Current Events (${(u.days || []).join(', ')}): ${u.covered_by_some_story || 0} of ${u.events} events match some captured story; the rest had no matching story in ANY sampled feed. ${escapeHtml(u.method_caveat || '')}</p>
      <details><summary style="cursor:pointer; font-size:0.85rem; color:#555;">Events with no observed roster coverage (${(u.uncovered_by_roster || []).length})</summary>${uncovered}</details>
    </div>` : ''}

}

function renderArticle(analysis) {
  currentArticle = analysis;
  currentEvent = null;
  dropZone.hidden = true;
  viewer.hidden = false;
  removeBackButton();

  document.getElementById('claim-phrase').textContent =
    analysis.source_title || analysis.source_url || '(source analysis)';

  const meta = document.getElementById('meta-bar');
  meta.innerHTML = '';
  addMeta(meta, 'analysis', analysis.analysis_id);
  if (analysis.source_platform) addMeta(meta, 'platform', analysis.source_platform);
  if (analysis.source_author) addMeta(meta, 'author', analysis.source_author);
  if (analysis.source_published_at) addMeta(meta, 'published', (analysis.source_published_at || '').split('T')[0]);
  addMeta(meta, 'claims', String((analysis.claims || []).length));

  // Hide the per-fingerprint tab nav at the article level
  document.getElementById('tabs').style.display = 'none';

  const fpById = {};
  (analysis.fingerprints || []).forEach(f => { fpById[f.fingerprint_id] = f; });

  const claimsHtml = (analysis.claims || []).map((c, idx) => {
    const hasFp = !!fpById[c.fingerprint_id];
    const traceable = c.traceable !== false && ['fact', 'study', 'narrative'].includes(c.claim_type);
    const ctype = c.claim_type || 'narrative';
    let cta;
    if (hasFp) cta = '<div class="claim-cta">View fingerprint →</div>';
    else if (!traceable) cta = '<div class="claim-cta empty">(not traceable — opinions and unverifiable claims aren\'t fingerprinted)</div>';
    else cta = '<div class="claim-cta empty">(traceable, but not fingerprinted — run without --extract-only)</div>';
    return `
      <div class="card claim-card ${hasFp ? 'clickable' : ''}" data-claim-idx="${idx}">
        <div class="claim-card-head">
          <span class="claim-type-badge type-${escapeHtml(ctype)}">${escapeHtml(ctype)}</span>
          ${c.context ? `<span class="claim-context">${escapeHtml(c.context)}</span>` : ''}
        </div>
        <div class="claim-text">${escapeHtml(c.claim_text || '')}</div>
        ${c.significance ? `<div class="claim-significance">${escapeHtml(c.significance)}</div>` : ''}
        ${cta}
      </div>
    `;
  }).join('');

  const main = document.querySelector('main');
  main.innerHTML = `
    <div class="article-intro">
      ${analysis.source_url ? `<a href="${escapeHtml(analysis.source_url)}" target="_blank" rel="noopener">${escapeHtml(analysis.source_url)}</a>` : ''}
      <p>${(analysis.claims || []).length} significant claims extracted${(analysis.fingerprints || []).length ? ` · ${analysis.fingerprints.length} traceable claims fingerprinted` : ''}. Click a traceable claim to trace where it comes from.</p>
    </div>
    ${renderBreakdown(analysis.breakdown)}
    ${analysis.content_excerpt ? `<details class="collapse"><summary>Source excerpt</summary><div class="body normal-text">${escapeHtml(analysis.content_excerpt)}…</div></details>` : ''}
    ${claimsHtml || '<p class="empty">No claims extracted.</p>'}
  `;

  main.querySelectorAll('.claim-card.clickable').forEach(card => {
    card.onclick = () => {
      const idx = parseInt(card.dataset.claimIdx, 10);
      const claim = analysis.claims[idx];
      const fp = fpById[claim.fingerprint_id];
      if (fp) openFingerprintFromArticle(fp);
    };
  });
}

function renderBreakdown(breakdown) {
  if (!breakdown || !breakdown.total) return '';
  // Order types by a stable convention: traceable first, then non-traceable
  const order = ['fact', 'study', 'narrative', 'opinion', 'unverifiable'];
  const counts = breakdown.counts || {};
  const pcts = breakdown.percentages || {};
  const present = order.filter(t => counts[t]);
  // Include any unexpected types at the end
  Object.keys(counts).forEach(t => { if (!present.includes(t)) present.push(t); });

  const rows = present.map(t => {
    const pct = pcts[t] != null ? pcts[t] : 0;
    return `
      <div class="breakdown-row">
        <span class="breakdown-label">${escapeHtml(t)}</span>
        <span class="breakdown-track"><span class="breakdown-fill type-${escapeHtml(t)}" style="width:${pct}%"></span></span>
        <span class="breakdown-pct">${pct}% (${counts[t]})</span>
      </div>
    `;
  }).join('');

  const traceableNote = breakdown.traceable_count != null
    ? ` · ${breakdown.traceable_count}/${breakdown.total} traceable`
    : '';

  return `
    <div class="card breakdown-card">
      <h2>Content Breakdown</h2>
      ${breakdown.characterization ? `<p class="breakdown-char">${escapeHtml(breakdown.characterization)}</p>` : ''}
      ${rows}
      <p style="color:#999; font-size:0.78rem; margin:0.7rem 0 0;">${breakdown.total} claims classified${traceableNote}. This is a profile of the significant claims extracted, not an exhaustive census.</p>
    </div>
  `;
}

function openFingerprintFromArticle(fp) {
  document.getElementById('tabs').style.display = '';
  render(fp);
  // Inject a back button into the header so the user can return to the
  // article's claim list.
  removeBackButton();
  const header = document.querySelector('header');
  const back = document.createElement('button');
  back.id = 'back-to-article';
  back.textContent = '← Back to article';
  back.onclick = () => {
    if (currentArticle) renderArticle(currentArticle);
  };
  header.insertBefore(back, header.firstChild);
}

function render(fp) {
  currentFP = fp;
  dropZone.hidden = true;
  viewer.hidden = false;

  document.getElementById('claim-phrase').textContent =
    fp.lexical.canonical_phrase || '(no canonical phrase)';

  const meta = document.getElementById('meta-bar');
  meta.innerHTML = '';
  addMeta(meta, 'id', fp.fingerprint_id);
  addMeta(meta, 'created', (fp.created_at || '').split('T')[0]);
  const scope = fp.scope || {};
  const window = (scope.time_window_start || '—') + ' to ' + (scope.time_window_end || 'present');
  addMeta(meta, 'scope', `${scope.language || 'en'} · ${scope.region || 'global'} · ${window}`);
  addMeta(meta, 'schema', fp.taxonomy_version || '?');
  // Overall analysis provenance — the honest "this whole thing is AI" signal
  if (fp.provenance) {
    const span = document.createElement('span');
    span.innerHTML = `<strong>analysis:</strong> ${provenanceBadge(fp)}`;
    meta.appendChild(span);
  }

  renderOverview(fp);
  renderLexical(fp);
  renderConceptual(fp);
  renderRhetorical(fp);
  renderLineages(fp);
  renderEvidence(fp);

  document.querySelectorAll('#tabs button').forEach(btn => {
    btn.onclick = () => switchTab(btn.dataset.tab);

function addMeta(parent, label, value) {
  const span = document.createElement('span');
  span.innerHTML = `<strong>${escapeHtml(label)}:</strong> ${escapeHtml(value || '')}`;
  parent.appendChild(span);
}

function switchTab(name) {
  document.querySelectorAll('#tabs button').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('section[data-panel]').forEach(s =>
    s.hidden = s.dataset.panel !== name);
  // Redraw timelines on activation; SVG clientWidth is 0 while hidden, so
  // we have to draw after the panel is visible.
  if (name === 'lineages' && currentFP) {
    const lex = currentFP.genealogy?.lexical?.attestation_log || [];
    const con = currentFP.genealogy?.conceptual?.attestation_log || [];
    const lexStats = currentFP.genealogy?.lexical?.timeline_stats || {};
    const conStats = currentFP.genealogy?.conceptual?.timeline_stats || {};
    requestAnimationFrame(() => {
      drawTimeline('timeline-lexical', lex);
      drawTimeline('timeline-conceptual', con);
      drawStatsChart('stats-lexical', lexStats);
      drawStatsChart('stats-conceptual', conStats);
    });
  }
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function instancesByRole(log) {
  const grouped = {};
  ROLE_ORDER.forEach(r => grouped[r] = []);
  (log || []).forEach(i => {
    const r = i.amplifier_role || 'unknown';
    if (grouped[r]) grouped[r].push(i); else grouped.unknown.push(i);
  });
  return grouped;
}

function instanceLine(i) {
  return `<div style="margin: 0.4rem 0; font-size: 0.92rem;">
    <strong>${escapeHtml(i.date || '?')}</strong> · ${escapeHtml(i.author || '')} — ${escapeHtml(i.source_title || '')}
  </div>`;
}

function truncate(s, max) {
  s = String(s || '');
  return s.length > max ? s.slice(0, max - 3) + '...' : s;
}

function verifyBadge(item) {
  // item is any object with verification fields (InformationSource,
  // AttestedInstance, SocialAttestedInstance). Returns badge HTML or ''
  // if the item predates the verification feature (status: 'unchecked'
  // with no notes — likely an old fingerprint).
  const status = item.verification_status || 'unchecked';
  const notes = item.verification_notes || '';
  if (status === 'unchecked' && !notes) return '';
  const symbol = {
    'verified': '✓ verified',
    'unchecked': '↻ unchecked',
    'url-error': '✗ URL error',
    'fetch-error': '✗ fetch error',
    'quote-not-found': '⚠ quote not found',
  }[status] || status;
  const tooltipParts = [status];
  if (notes) tooltipParts.push(notes);
  const tooltip = tooltipParts.join(' — ');
  return `<span class="verify-badge ${escapeHtml(status)}" title="${escapeHtml(tooltip)}">${escapeHtml(symbol)}</span>`;
}

function archiveBadge(item) {
  const archive = item.archive_url || '';
  if (!archive) return '';
  return `<a href="${escapeHtml(archive)}" target="_blank" rel="noopener" class="archive-link" title="Wayback snapshot">📦 archive</a>`;
}

function provenanceBadge(item) {
  // Reads item.provenance ({origin, status, model, contributor_name,
  // confirmation_count, dispute_count}). Quiet by default — AI-generated
  // shows a small muted 'AI' chip; the human states (added / confirmed /
  // consensus / disputed / retracted) light up automatically once the
  // contribution layer populates them. Returns '' for fingerprints that
  // predate the provenance field.
  const p = item && item.provenance;
  if (!p) return '';
  const status = p.status || 'ai_generated';
  const conf = p.confirmation_count || 0;
  const disp = p.dispute_count || 0;
  let label, cls, tip;
  switch (status) {
    case 'ai_generated':
      label = 'AI'; cls = 'ai';
      tip = 'AI-generated' + (p.model ? ' · ' + p.model : '') + ' · not human-reviewed';
      break;
    case 'human_added':
      label = '✎ human'; cls = 'human';
      tip = 'Added by ' + (p.contributor_name || 'a contributor');
      break;
    case 'human_confirmed':
      label = '✓ confirmed' + (conf ? ' (' + conf + ')' : ''); cls = 'confirmed';
      tip = 'AI-generated, human-confirmed';
      break;
    case 'consensus':
      label = '✓✓ consensus'; cls = 'consensus';
      tip = 'Multiple contributors agree';
      break;
    case 'disputed':
      label = '⚠ disputed' + (disp ? ' (' + disp + ')' : ''); cls = 'disputed';
      tip = 'Disputed by contributors';
      break;
    case 'retracted':
      label = '✗ retracted'; cls = 'retracted';
      tip = 'Marked incorrect by consensus';
      break;
    default:
      label = status; cls = 'ai'; tip = status;
  }
  return `<span class="prov-badge prov-${cls}" title="${escapeHtml(tip)}">${escapeHtml(label)}</span>`;
}

function fmtDaysHuman(d) {
  if (d == null) return '—';
  if (d < 730) return `${d.toLocaleString()} days`;
  return `${d.toLocaleString()} days (${(d / 365).toFixed(1)} years)`;
}
