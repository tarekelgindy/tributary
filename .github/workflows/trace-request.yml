# Fulfill trace requests automatically (Phase 2.9-A): when a request issue is
# opened from the template (label: trace-request), generate the trace — an
# origin trace for claims, a lean framing map for events — publish it, and
# post the permalink back, typically within ~5-10 minutes.
#
# Spend controls:
#   - DAILY_CAP auto-fulfillments per UTC day (counted from commit messages);
#     overflow gets a polite "queued" reply, and a maintainer can force any
#     request past the cap by applying the 'approved-trace' label.
#   - Lean generation settings + web-search caps per run.
#   - Issue title/body are attacker-controlled text: they pass exclusively
#     through env vars, never interpolated into scripts.
#
# Requires the ANTHROPIC_API_KEY repository secret and the labels
# 'trace-request' / 'approved-trace'.
name: fulfill-trace-request

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: trace-requests
  cancel-in-progress: false

env:
  DAILY_CAP: 10

jobs:
  fulfill:
    if: >
      (github.event.action == 'opened' &&
       contains(github.event.issue.labels.*.name, 'trace-request')) ||
      (github.event.action == 'labeled' &&
       github.event.label.name == 'approved-trace')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the daily cap counts today's fulfillment commits

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (generation needs only anthropic + httpx)
        run: pip install --quiet anthropic httpx

      - name: Generate and publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TRIGGER: ${{ github.event.action }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # ---- daily cap (manual approved-trace label bypasses it) ----
          TODAY_COUNT=$(git log --since="$(date -u +%Y-%m-%d) 00:00" \
                        --grep='^Trace request #' --oneline | wc -l)
          if [ "$TRIGGER" = "opened" ] && [ "$TODAY_COUNT" -ge "$DAILY_CAP" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "Today's auto-generation capacity ($DAILY_CAP traces) is used up — your request is queued and will run tomorrow, or sooner if a maintainer approves it."
            exit 0
          fi

          # ---- route: event framing map vs origin trace ----
          IS_EVENT=0
          if printf '%s' "$ISSUE_TITLE" | grep -qi '^Event request' \
             || printf '%s' "$ISSUE_BODY" | grep -qiE '^\**Type:\**[[:space:]]*event'; then
            IS_EVENT=1
          fi
          SUBJECT="${ISSUE_TITLE#Trace request: }"
          SUBJECT="${SUBJECT#Trace request:}"
          SUBJECT="${SUBJECT#Event request: }"
          SUBJECT="${SUBJECT#Event request:}"
          if [ -z "${SUBJECT// /}" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "Could not read a subject from the issue title — expected \`Trace request: <claim>\` or \`Event request: <event>\`."
            exit 1
          fi

          # ---- generate (lean, search-capped) ----
          if [ "$IS_EVENT" = "1" ]; then
            echo "::notice::event framing map: $SUBJECT"
            python fingerprint.py "$SUBJECT" --event --lean-framings --save --max-searches 4 > out.json
            ID=$(grep -o '"analysis_id": *"[a-f0-9]*"' out.json | head -1 | grep -o '[a-f0-9]\{12\}' || true)
            REL="gallery/events/$ID.json"
          else
            echo "::notice::origin trace: $SUBJECT"
            python fingerprint.py "$SUBJECT" --save --max-searches 4 > out.json
            ID=$(grep -o '\[saved fingerprint: [a-f0-9]*\]' out.json | tail -1 | grep -o '[a-f0-9]\{12\}' || true)
            REL="gallery/traces/$ID.json"
            mkdir -p gallery/traces
            cp "fingerprints/$ID.json" "gallery/traces/$ID.json"
          fi
          if [ -z "$ID" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "Generation ran but no output was saved — a maintainer will look at the run log."
            exit 1
          fi

          python publish.py   # exports events/, rebuilds gallery index + search index

          git config user.name "tributary-trace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gallery
          git commit -m "Trace request #$ISSUE_NUMBER: $SUBJECT ($REL)"
          git pull --rebase origin main
          git push origin main

          URL="https://tarekelgindy.github.io/tributary/fingerprint_viewer.html?load=$REL"
          gh issue comment "$ISSUE_NUMBER" --body "Traced and published: $URL

          (If the viewer page itself looks stale, give the site cache a few minutes — the trace data is live now. Everything is AI-generated and labeled as such, with sources on every hop; corrections welcome on this issue.)"
          gh issue close "$ISSUE_NUMBER" --reason completed
