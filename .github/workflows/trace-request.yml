# Fulfill trace requests (Phase 2.9): two entry paths, one engine.
#
#   1. repository_dispatch "trace-request" — sent by the Cloudflare Worker
#      (infra/worker.js) when a visitor uses the website's in-window request
#      flow. The Worker enforces rate limits and holds the only PAT; this
#      workflow reports completion back to it so the site can show the
#      permalink without the visitor ever leaving the page.
#   2. GitHub issues from the trace-request template — kept as a manual /
#      fallback path. Auto-runs on open (daily cap applies); the
#      'approved-trace' label force-runs past the cap.
#
# Untrusted text (issue title/body, dispatch payload) flows exclusively
# through env vars — never interpolated into scripts.
#
# Secrets: ANTHROPIC_API_KEY (generation);
#          WORKER_URL + CALLBACK_SECRET (dispatch-path completion callback).
name: fulfill-trace-request

on:
  repository_dispatch:
    types: [trace-request]
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: trace-requests
  cancel-in-progress: false

env:
  DAILY_CAP: 10

jobs:
  fulfill:
    if: >
      github.event_name == 'repository_dispatch' ||
      (github.event.action == 'opened' &&
       contains(github.event.issue.labels.*.name, 'trace-request')) ||
      (github.event.action == 'labeled' &&
       github.event.label.name == 'approved-trace')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the issue-path daily cap counts today's fulfillment commits

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (generation needs only anthropic + httpx)
        # anthropic pinned <1: the 1.x SDK removed the temperature kwarg from
        # messages.create() (TypeError), which silently broke every request
        # between the 1.x release and 2026-09-14. The 0.x->1.x migration of
        # fingerprint.py is queued work; unpin when it lands.
        run: pip install --quiet "anthropic<1" httpx pillow

      - name: Cache caches (pip wheels + the pinned embedding model)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: trace-request-semantic-v1

      - name: Install semantic-matcher deps (optional stage)
        # CPU-only torch: the default Linux torch wheel bundles CUDA (~2.5GB)
        # this runner can't use. Failure is non-fatal by design — fingerprint.py
        # degrades to lexical + polarity-judge serving without the matcher.
        continue-on-error: true
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet sentence-transformers

      - name: Hydrate match-and-serve store from the published corpus
        # fingerprints/ is gitignored and therefore EMPTY on this runner —
        # which silently disabled match-and-serve from launch until 2026-10-01:
        # every duplicate request paid full generation price. Hydration flows
        # ONE direction (gallery -> store; gallery stays canonical), then the
        # backfill embeds the store for the semantic stage.
        run: |
          python hydrate_store.py --force
          python matcher.py --backfill || echo "::warning::matcher backfill failed - semantic stage disabled this run (lexical + judge still serve)"

      - name: Generate and publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TRIGGER: ${{ github.event.action }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
          DISPATCH_SUBJECT: ${{ github.event.client_payload.subject }}
          DISPATCH_KIND: ${{ github.event.client_payload.kind }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          say() {  # report progress to whichever channel this request came from
            if [ -n "${REQUEST_ID:-}" ]; then
              return 0   # dispatch path reports only on completion (see below)
            fi
            gh issue comment "$ISSUE_NUMBER" --body "$1"
          }

          # ---- subject + kind, per path ----
          if [ -n "${REQUEST_ID:-}" ]; then
            SUBJECT="$DISPATCH_SUBJECT"
            IS_EVENT=$([ "$DISPATCH_KIND" = "event" ] && echo 1 || echo 0)
            # rate limiting for this path lives in the Worker (sole PAT holder)
          else
            # daily cap for the issue path (approved-trace label bypasses it)
            TODAY_COUNT=$(git log --since="$(date -u +%Y-%m-%d) 00:00" \
                          --grep='^Trace request' --oneline | wc -l)
            if [ "$TRIGGER" = "opened" ] && [ "$TODAY_COUNT" -ge "$DAILY_CAP" ]; then
              say "Today's auto-generation capacity ($DAILY_CAP traces) is used up — your request is queued and will run tomorrow, or sooner if a maintainer approves it."
              exit 0
            fi
            IS_EVENT=0
            if printf '%s' "$ISSUE_TITLE" | grep -qi '^Event request' \
               || printf '%s' "$ISSUE_BODY" | grep -qiE '^\**Type:\**[[:space:]]*event'; then
              IS_EVENT=1
            fi
            SUBJECT="${ISSUE_TITLE#Trace request: }"
            SUBJECT="${SUBJECT#Trace request:}"
            SUBJECT="${SUBJECT#Event request: }"
            SUBJECT="${SUBJECT#Event request:}"
          fi
          if [ -z "${SUBJECT// /}" ]; then
            say "Could not read a subject from the request."
            exit 1
          fi

          # ---- generate (lean, search-capped) ----
          if [ "$IS_EVENT" = "1" ]; then
            echo "::notice::event framing map: $SUBJECT"
            python fingerprint.py "$SUBJECT" --event --lean-framings --save --max-searches 4 > out.json
            ID=$(grep -o '"analysis_id": *"[a-f0-9]*"' out.json | head -1 | grep -o '[a-f0-9]\{12\}' || true)
            REL="gallery/events/$ID.json"
          else
            echo "::notice::origin trace: $SUBJECT"
            # lean + evidence + conceptual: the supports/disputes map and the
            # idea lineage are the reader-valuable deep layers. Conceptual
            # added 2026-09-18 (Tarek's call after the spot-check showed
            # phrasing-only traces understate idea-older-than-phrasing
            # stories): ~$0.70/request, DAILY_CAP 10 -> ceiling ~$7/day.
            python fingerprint.py "$SUBJECT" --evidence --conceptual --save --max-searches 4 > out.json
            # Claim-shape gate (2026-10-08): non-claim input (bare keywords,
            # fragments) bounces BEFORE the pipeline spends — the requester
            # gets the reason and a rephrasing hint, not a generic failure.
            if grep -q '^GATE=rejected' out.json; then
              REASON=$(grep -o '\[not a traceable claim:[^]]*\]' out.json | head -1 | sed 's/^\[//; s/\]$//' | cut -c1-240)
              REASON_JSON=$(python -c 'import json,sys; print(json.dumps(sys.argv[1]))' "$REASON")
              echo "::notice::gate rejected: $REASON"
              if [ -n "${REQUEST_ID:-}" ]; then
                curl -sS -X POST "$WORKER_URL/complete" \
                  -H "Content-Type: application/json" \
                  -H "X-Callback-Secret: $CALLBACK_SECRET" \
                  -d "{\"id\":\"$REQUEST_ID\",\"state\":\"rejected\",\"reason\":$REASON_JSON}" || true
              else
                gh issue comment "$ISSUE_NUMBER" --body "We couldn't trace that: $REASON

                Phrase the request as a full claim — e.g. \"all Mexicans like tacos\" rather than keywords — and open a new request."
                gh issue close "$ISSUE_NUMBER" --reason "not planned"
              fi
              exit 0
            fi
            ID=$(grep -o '\[saved fingerprint: [a-f0-9]*\]' out.json | tail -1 | grep -o '[a-f0-9]\{12\}' || true)
            # Match-and-serve outputs (judge-gated, polarity-aware since
            # 2026-09-25): a lexical or semantic hit serves an existing
            # fingerprint instead of generating; POLARITY=negation marks a
            # request that negates the served claim (viewer shows the note).
            if [ -z "$ID" ]; then
              ID=$(grep -o '\[matched existing fingerprint: [a-f0-9]\{12\}' out.json | tail -1 | grep -o '[a-f0-9]\{12\}' || true)
            fi
            if [ -z "$ID" ]; then
              ID=$(grep -oE 'serve_(cached|negation) -> [a-f0-9]{12}|lexical_variant -> [a-f0-9]{12}' out.json | tail -1 | grep -o '[a-f0-9]\{12\}' || true)
            fi
            POLARITY=$(grep -c '^POLARITY=negation' out.json || true)
            # Served vs generated: a fresh run prints "[saved fingerprint:";
            # a match-and-serve answer doesn't. The Worker refunds the daily
            # budget slot for serves (the cap buys NOVEL traces only).
            SERVED=0
            if [ -n "$ID" ] && ! grep -q '\[saved fingerprint:' out.json; then
              SERVED=1
              echo "::notice::served from the published corpus: $ID (no generation cost)"
            fi
            REL="gallery/traces/$ID.json"
            mkdir -p gallery/traces
            # freshly generated -> copy from the store; served-from-cache ->
            # the published copy already exists
            if [ -f "fingerprints/$ID.json" ]; then
              cp "fingerprints/$ID.json" "gallery/traces/$ID.json"
            fi
          fi
          if [ -z "$ID" ]; then
            say "Generation ran but no output was saved — a maintainer will look at the run log."
            exit 1
          fi

          python publish.py   # exports events/, rebuilds gallery index + search index

          # every published trace and event gets a share card (viewer's Share
          # button depends on it); DejaVu fallback fonts on CI, never fatal.
          # NEVER on a serve: the published card already exists, and the
          # first production serve (2026-10-01) re-rendered it with CI
          # fallback fonts — overwriting the identity-styled published card
          # (stale-source disease #4, CORRECTIONS.md). Serves change nothing.
          # Publication threshold (2026-10-08): a weak trace stays reachable
          # at its permalink (the viewer banners it) but gets no card and no
          # corpus/search listing (publish.py already excluded it above).
          LISTED=1
          if [ "$IS_EVENT" != "1" ] && [ -f "$REL" ]; then
            LISTED=$(python -c "import json,sys; from publish import is_weak_trace; print(0 if is_weak_trace(json.load(open('$REL', encoding='utf-8'))) else 1)" || echo 1)
          fi
          if [ "${SERVED:-0}" = "1" ]; then
            echo "served from cache - published card untouched"
          elif [ "${LISTED:-1}" != "1" ]; then
            echo "::notice::below publication threshold - reachable but unlisted, no card"
          elif [ "$IS_EVENT" != "1" ]; then
            python cards.py --fp "$ID" || echo "::warning::card render failed for $ID"
          else
            python cards.py --event "$ID" || echo "::warning::event card render failed for $ID"
          fi

          git config user.name "tributary-trace-bot"
          git config user.email "actions@users.noreply.github.com"
          # Push with re-derivation retry (2026-10-09): concurrent runs ALWAYS
          # conflict in the derived index files (every run rewrites them), and
          # the old bare `pull --rebase` died on it — a finished $0.70 trace
          # was lost exactly this way. A conflict here means "derived against
          # a stale gallery": reset to the remote's truth, restore this run's
          # own artifacts (still in the gitignored staging dirs), re-derive,
          # commit again. The trace file itself is additive and never truly
          # conflicts.
          PUSHED=0
          for attempt in 1 2 3; do
            git add gallery
            # a served-from-cache hit changes nothing -> nothing to commit
            if git diff --cached --quiet; then
              PUSHED=1
              break
            fi
            git commit -m "Trace request ${ISSUE_NUMBER:+#$ISSUE_NUMBER }${REQUEST_ID:+[$REQUEST_ID] }: $SUBJECT ($REL)"
            if git pull --rebase origin main && git push origin main; then
              PUSHED=1
              break
            fi
            echo "::warning::push attempt $attempt hit a concurrent-publish race - re-deriving against the latest gallery"
            git rebase --abort 2>/dev/null || true
            git reset --hard origin/main
            if [ "$IS_EVENT" != "1" ] && [ -f "fingerprints/$ID.json" ]; then
              cp "fingerprints/$ID.json" "gallery/traces/$ID.json"
            fi
            # events re-enter gallery via publish.py's staging copy
            python publish.py
            if [ "${SERVED:-0}" != "1" ] && [ "${LISTED:-1}" = "1" ]; then
              if [ "$IS_EVENT" != "1" ]; then
                python cards.py --fp "$ID" || true
              else
                python cards.py --event "$ID" || true
              fi
            fi
          done
          if [ "$PUSHED" != "1" ]; then
            say "Publishing hit a persistent race - a maintainer will look at the run log."
            exit 1
          fi

          URL="https://tributary.tools/fingerprint_viewer.html?load=$REL"
          if [ "${POLARITY:-0}" != "0" ]; then
            URL="$URL&polarity=negation"
          fi

          # Don't report "done" until Pages is actually serving the file —
          # the push-to-deploy gap is 2-4 min, and a visitor who clicks the
          # fresh link inside it gets a 404 (happened live 2026-09-18).
          # Proceed after ~5 min regardless; the link heals on its own.
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://tributary.tools/$REL" || echo 0)
            [ "$CODE" = "200" ] && break
            sleep 10
          done

          if [ -n "${REQUEST_ID:-}" ]; then
            DONE="{\"id\":\"$REQUEST_ID\",\"state\":\"done\",\"url\":\"$URL\""
            if [ "${SERVED:-0}" = "1" ]; then DONE="$DONE,\"served\":true"; fi
            DONE="$DONE}"
            curl -sS -X POST "$WORKER_URL/complete" \
              -H "Content-Type: application/json" \
              -H "X-Callback-Secret: $CALLBACK_SECRET" \
              -d "$DONE" || true
          else
            gh issue comment "$ISSUE_NUMBER" --body "Traced and published: $URL

            (Everything is AI-generated and labeled as such, with sources on every hop; corrections welcome on this issue.)"
            gh issue close "$ISSUE_NUMBER" --reason completed
          fi

      - name: Report failure to the site
        if: failure() && github.event_name == 'repository_dispatch'
        env:
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        run: |
          curl -sS -X POST "$WORKER_URL/complete" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: $CALLBACK_SECRET" \
            -d "{\"id\":\"$REQUEST_ID\",\"state\":\"failed\"}" || true
